<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#151412">
<title>Cata de perfumes · AlixPartners</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;500;600;700&family=Lobster+Two:ital,wght@1,400;1,700&display=swap" rel="stylesheet">
<style>
:root{ --bg:#F6F1E7; --card:#FFFDF8; --ink:#151412; --dim:#6E665C; --gold:#B08A4E; --green:#2F4A3A; --line:#E4DACA; --soft:#EFE7D8;
  --ok:#2F7A52; --warn:#B4562E; --sans:Montserrat, system-ui, -apple-system, sans-serif; --script:"Lobster Two", Georgia, serif; color-scheme:light; }
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%;}
body{padding:0 max(16px, env(safe-area-inset-left,0px)) 110px max(16px, env(safe-area-inset-right,0px));}
button,input,select,textarea{font:inherit;color:inherit;}
button{cursor:pointer;border:0;background:none;}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
.top{position:sticky;top:0;z-index:10;background:var(--bg);display:flex;align-items:center;gap:10px;padding:12px 0 10px;border-bottom:1px solid var(--line);margin:0 calc(-1 * max(16px, env(safe-area-inset-left,0px)));padding-inline:max(16px, env(safe-area-inset-left,0px));}
.top .back{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);font-size:20px;flex:none;}
.marca{flex:1;min-width:0;}
.marca b{display:block;font-weight:400;letter-spacing:4px;font-size:15px;text-transform:uppercase;}
.marca small{display:block;font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.prog{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);text-align:right;white-space:nowrap;}
main{max-width:560px;margin:0 auto;padding-top:18px;}
.eb{font-size:11px;letter-spacing:4px;text-transform:uppercase;color:var(--gold);font-weight:600;}
h1{font-weight:300;font-size:30px;line-height:1.1;letter-spacing:.5px;margin:6px 0 8px;}
h2{font-weight:500;font-size:13px;letter-spacing:3px;text-transform:uppercase;margin:22px 0 10px;color:var(--green);}
.sub{color:var(--dim);font-size:16px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;}
.btn{display:block;width:100%;padding:17px;border-radius:14px;background:var(--ink);color:var(--bg);font-weight:600;letter-spacing:2.5px;text-transform:uppercase;font-size:14px;margin-top:12px;text-align:center;}
.btn.gold{background:var(--gold);color:#fff;}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink);}
.btn:disabled{opacity:.35;cursor:default;}
.fijo{position:fixed;left:0;right:0;bottom:0;z-index:9;background:linear-gradient(transparent, var(--bg) 30%);padding:18px max(16px, env(safe-area-inset-left,0px)) calc(14px + env(safe-area-inset-bottom,0px));}
.fijo .in{max-width:560px;margin:0 auto;display:flex;gap:10px;}
.fijo .btn{margin-top:0;}
.fijo .btn.ghost{flex:0 0 34%;}
.fld{margin-top:16px;}
.fld label{display:block;font-size:12px;letter-spacing:2px;text-transform:uppercase;font-weight:600;margin-bottom:6px;}
.fld small{font-weight:400;color:var(--dim);letter-spacing:0;text-transform:none;font-size:12px;}
.fld input,.fld textarea{width:100%;padding:14px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-size:17px;}
.fld input:focus,.fld textarea:focus{border-color:var(--gold);outline:none;}
.ac{position:relative;margin-top:8px;}
.acl{display:none;position:absolute;left:0;right:0;top:100%;z-index:5;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-top:4px;box-shadow:0 8px 24px rgba(0,0,0,.08);overflow:hidden;}
.acl button{display:block;width:100%;text-align:left;padding:12px 14px;border-bottom:1px solid var(--soft);font-size:15px;}
.acl button span{color:var(--dim);font-size:13px;}
.tuyo{margin-top:10px;padding:12px 14px;border-radius:12px;background:var(--soft);font-size:15px;}
.tuyo b{font-family:var(--script);font-weight:400;font-size:22px;}
.aviso{margin-top:12px;padding:12px 14px;border-radius:12px;background:#FBEDE4;color:#7A3B1E;font-size:14px;}
/* ficha de cata */
.ficha .foto{width:100%;aspect-ratio:4/3;object-fit:contain;display:block;margin:0 auto 6px;max-height:34vh;}
.ficha h1{margin:2px 0 2px;}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.chip{font-size:12px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);}
.fuerza{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;color:var(--dim);}
.fuerza .b{display:flex;gap:3px;}
.fuerza i{width:14px;height:8px;border-radius:2px;background:var(--line);display:block;}
.fuerza i.on{background:var(--green);}
.apodo{font-style:italic;font-size:15px;color:var(--green);font-weight:500;margin-top:4px;}
.perfil{font-size:18px;font-weight:300;margin-top:10px;}
dl.tec{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin-top:12px;font-size:14px;}
dl.tec dt{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);font-weight:600;padding-top:2px;}
.aporta{margin-top:12px;font-size:15px;border-left:3px solid var(--gold);padding-left:12px;}
.votos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px;}
.votos button{border:1.5px solid var(--line);border-radius:14px;padding:12px 4px;background:var(--card);font-size:12.5px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:74px;justify-content:center;}
.votos button b{font-size:20px;}
.votos button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);}
.emos{display:flex;flex-wrap:wrap;gap:8px;}
.emos button{padding:9px 13px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-size:14px;}
.emos button[aria-pressed="true"]{background:var(--green);color:#fff;border-color:var(--green);}
.cuenta{font-size:12px;color:var(--dim);text-align:right;margin-top:4px;}
/* barras */
.barras{display:flex;flex-direction:column;gap:8px;}
.barra{display:grid;grid-template-columns:96px 1fr 40px;align-items:center;gap:10px;font-size:14px;}
.barra .t{height:12px;border-radius:6px;background:var(--soft);overflow:hidden;}
.barra .t i{display:block;height:100%;background:var(--green);border-radius:6px;}
.barra span:last-child{text-align:right;color:var(--dim);font-size:13px;}
/* bases */
.bases{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.bopt{border:1.5px solid var(--line);border-radius:16px;padding:10px;background:var(--card);text-align:left;position:relative;}
.bopt img{width:100%;aspect-ratio:1/1;object-fit:contain;}
.bopt b{display:block;font-weight:600;font-size:14px;margin-top:4px;}
.bopt small{display:block;color:var(--dim);font-size:12px;}
.bopt.p{border-color:var(--ink);border-width:2.5px;}
.bopt.s{border-color:var(--gold);border-width:2.5px;}
.bopt .tag{position:absolute;top:8px;left:8px;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;font-weight:700;padding:4px 8px;border-radius:999px;background:var(--ink);color:var(--bg);}
.bopt.s .tag{background:var(--gold);}
.bopt .rec2{display:block;font-size:10px;letter-spacing:1px;text-transform:uppercase;font-weight:700;color:var(--green);margin-top:4px;}
.bopt .rec{position:absolute;top:8px;right:8px;font-size:10px;letter-spacing:1px;text-transform:uppercase;font-weight:700;color:var(--green);}
.seg{display:flex;gap:6px;margin-top:8px;}
.seg button{flex:1;padding:9px 4px;border:1.5px solid var(--line);border-radius:10px;font-size:12px;font-weight:600;background:var(--card);}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);}
/* fórmula */
.etapa{margin-top:14px;}
.etapa h3{display:flex;justify-content:space-between;font-size:12px;letter-spacing:3px;text-transform:uppercase;font-weight:600;color:var(--green);padding-bottom:6px;border-bottom:1px solid var(--line);}
.fl{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--soft);}
.fl img{width:42px;height:42px;object-fit:contain;flex:none;}
.fl .n{flex:1;min-width:0;}
.fl .n b{display:block;font-weight:500;font-size:15px;}
.fl .n small{color:var(--dim);font-size:12px;}
.fl .g{font-weight:600;font-variant-numeric:tabular-nums;font-size:17px;white-space:nowrap;}
.fl.pesado{opacity:.5;}
.fl .tick{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--line);font-size:20px;flex:none;}
.fl.pesado .tick{background:var(--ok);color:#fff;border-color:var(--ok);}
.total{display:flex;justify-content:space-between;font-weight:700;font-size:18px;padding:12px 0;border-top:2px solid var(--ink);margin-top:8px;}
.viz{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center;}
.viz svg{width:100%;height:auto;display:block;}
.frase{text-align:center;font-weight:300;font-size:22px;margin:6px 0 2px;}
.evol{display:flex;flex-direction:column;gap:6px;margin-top:10px;}
.evol div{display:flex;gap:10px;font-size:14px;}
.evol b{flex:0 0 132px;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);padding-top:2px;}
/* laboratorio */
.lab .fl{flex-wrap:wrap;}
.lab .ctrl{display:flex;align-items:center;gap:4px;width:100%;}
.lab .ctrl button{flex:1;padding:9px 0;border:1.5px solid var(--line);border-radius:10px;font-size:13px;font-weight:600;background:var(--card);}
.lab .ctrl input{flex:1.3;min-width:0;text-align:center;padding:8px 4px;border:1.5px solid var(--ink);border-radius:10px;font-weight:700;font-size:16px;}
.lab .quitar{font-size:12px;color:var(--warn);text-decoration:underline;}
.warn{font-size:12.5px;color:var(--warn);width:100%;padding-left:52px;}
.sumar{display:flex;gap:8px;margin-top:10px;}
.sumar select{flex:1;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);}
.libre{display:flex;align-items:center;gap:10px;font-size:14px;margin-top:10px;}
.libre input{width:22px;height:22px;}
.stick{position:sticky;top:64px;z-index:5;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--line);}
.stick .viz{grid-template-columns:110px 1fr;}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:999px;font-size:14px;z-index:50;max-width:calc(100% - 32px);text-align:center;}
.modal{position:fixed;inset:0;z-index:40;background:rgba(21,20,18,.55);display:flex;align-items:flex-end;justify-content:center;}
.modal .caja{background:var(--bg);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px));}
.full{position:fixed;inset:0;z-index:60;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;color:#fff;text-align:center;}
.full img{max-width:100%;max-height:78vh;}
canvas#cv{width:100%;height:auto;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.12);display:block;}
.pie{text-align:center;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--dim);margin-top:30px;}
</style>
</head>

/* topes en g sobre 80: [general, con Musky, con Haba Tonka y Oud, con Tabaco y Pimienta, con Amaderada] */
const TOPES = {bergamota:[10,10,10,10,10], citrico:[10,10,10,10,10], grosellas:[4,4,4,3,4], pera:[6,6,6,3,6], bruma:[3,3,2,2,3], especias:[4,2,3,3,4],
  jazmin:[10,10,5,8,10], peonia:[14,14,12,10,14], rosa:[9,9,9,9,9], higo:[12,12,10,12,12], salvia:[8,8,4,8,8], vainilla:[6,6,6,6,6]};
const COLB = {musky:1, tonka:2, tabaco:3, amaderada:4};
const TOPE_BASE = 22;   /* g de una misma base por perfume: 25 perfumes × 22 g ≈ 550 g, dentro de los ~600 g de cada frasco */
const REDONDEO = {amaderada:{cor:'higo', sal:'bergamota'}, musky:{cor:'peonia', sal:'bergamota'}, tonka:{cor:'rosa', sal:'grosellas'}, tabaco:{cor:'higo', sal:'citrico'}};
const UNIVERSAL = {sal:'bergamota', cor:'peonia'};
const POTENCIAN = [['bergamota','citrico','Los dos cítricos se potencian'],['grosellas','bergamota','La bergamota levanta a la grosella'],['peonia','musky','El almizcle resalta el lado rosado de la peonía'],
  ['higo','amaderada','Las lactonas del higo y el sándalo se potencian'],['rosa','tabaco','Clásico rosa-tabaco'],['jazmin','grosellas','Efecto maracuyá']];
const VOTOS = [[3,'♥','Me encanta'],[2,'✦','Me gusta'],[1,'◦','Un poquito'],[0,'✕','No me gusta']];
const EMOCIONES = ['Alegría','Calma','Energía','Nostalgia','Sensualidad','Elegancia','Infancia','Hogar','Viaje','Naturaleza','Limpieza','Misterio'];

/* ======================= utilidades ======================= */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nz = s => String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
const r2 = x => Math.round(x*100)/100;
const fg = x => r2(x).toFixed(2).replace('.',',');
const LS = {get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const foto = k => IMGS[k] || '';
function aviso(t){ const d=document.createElement('div'); d.className='toast'; d.setAttribute('role','status'); d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),2200); }
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-'+Date.now().toString(36)+Math.random().toString(36).slice(2,8));
const dispositivo = () => { const u = navigator.userAgent||''; return /iPhone|iPad|iPod/i.test(u) || (/Macintosh/.test(u) && navigator.maxTouchPoints>1) ? 'iOS' : /Android/i.test(u) ? 'Android' : 'otro'; };
const embebido = () => /Instagram|FBAN|FBAV|Line\/|; wv\)|WhatsApp/i.test(navigator.userAgent||'');

function nuevo(){ return {id:uid(), creado:new Date().toLocaleString('es-AR'), nom:'', wa:'', perf:['','','','',''], v:{}, emo:{}, rec:{}, paso:'datos', i:0,
  principal:null, extras:[], guiada:null, f:null, modo:'guiado', libre:false, toque:{}, pesado:{}, pn:'', pnLista:'', ml:false, dev:dispositivo(), env:{}}; }
let P = Object.assign(nuevo(), LS.get(CONFIG.LS, {}));
while(P.perf.length < 5) P.perf.push('');
const guardar = () => LS.set(CONFIG.LS, P);

/* ======================= perfumes favoritos ======================= */
const FK = ['citrica','frutal','verde','floral','aromatica','ambar','gourmand','amaderada','oriental','cuero','especiada','almizclada'];
const FRAX = FRA.map(([n,b,v])=>({n,b,v,k:nz(n+' '+b),kn:nz(n)}));
function buscar(q){ q = nz(q); if(q.length<2) return []; const ws = q.split(' ');
  return FRAX.filter(f=>ws.every(w=>f.k.includes(w))).sort((a,b)=>(b.kn.startsWith(q)-a.kn.startsWith(q)) || a.n.length-b.n.length).slice(0,6); }
function encontrar(t){ const q = nz(t); if(!q) return null;
  return FRAX.find(f=>f.k===q) || FRAX.find(f=>f.kn===q) || FRAX.find(f=>q.startsWith(f.kn) && f.kn.length>3) || null; }
/* base recomendada por los perfumes que usa (5.2.1) */
function baseDeFavoritos(){
  const S = {}; FK.forEach(k=>S[k]=0); let n = 0;
  P.perf.forEach(t=>{ const f = encontrar(t); if(!f || !/[1-9]/.test(f.v)) return; n++; FK.forEach((k,i)=>S[k] += +f.v[i]); });
  if(!n) return null;
  const top = FK.slice().sort((a,b)=>S[b]-S[a])[0];
  if(S[top] <= 0) return null;
  if(top==='gourmand') return 'tonka';
  if(top==='floral') return (S.gourmand + S.oriental) > (S.citrica + S.almizclada) ? 'tonka' : 'musky';
  if(top==='oriental') return S.floral > S.amaderada ? 'tonka' : 'tabaco';
  if(['citrica','frutal','verde','almizclada'].includes(top)) return 'musky';
  if(['amaderada','aromatica'].includes(top)) return 'amaderada';
  return 'tabaco'; /* especiada, cuero, ambar */
}
/* perfil aromático según la cata */
/* afinidad 0..1 de cada componente con los perfumes que usa (familias de Fragrantica llevadas a las 10 de la app) */
const FK2 = {citrica:{citrico:1}, frutal:{frutal:1}, verde:{verde:1}, floral:{floral:1}, aromatica:{aromatico:1}, ambar:{especiado:.5, gourmand:.5},
  gourmand:{gourmand:1}, amaderada:{amaderado:1}, oriental:{especiado:.5, gourmand:.5}, cuero:{especiado:1}, especiada:{especiado:1}, almizclada:{almizclado:1}};
function perfilFavoritos(){
  const S = {}; FAM.forEach(([k])=>S[k]=0); let n = 0;
  P.perf.forEach(t=>{ const f = encontrar(t); if(!f || !/[1-9]/.test(f.v)) return; n++; FK.forEach((k,i)=>Object.entries(FK2[k]).forEach(([fa,w])=>S[fa] += (+f.v[i])*w)); });
  const mx = Math.max(...Object.values(S)); if(!n || !mx) return null; FAM.forEach(([k])=>S[k] /= mx); return S;
}
function afinidad(id){ const S = perfilFavoritos(); return S ? Object.entries(X[id].w).reduce((s,[k,w])=>s + w*S[k], 0) : 0; }
/* refuerzo: hasta +35 % por coincidir con sus perfumes y hasta +25 % si le despertó emociones */
const refuerzo = id => 1 + 0.35*afinidad(id) + 0.125*Math.min(2, (P.emo[id]||[]).length);
function perfilCata(){
  const S = {}; FAM.forEach(([k])=>S[k]=0);
  C.forEach(c=>{ const v = P.v[c.id]; if(v==null) return; Object.entries(c.w).forEach(([k,w])=>S[k] += v*w); });
  return S;
}
const ordenFam = S => FAM.map(f=>f[0]).sort((a,b)=>S[b]-S[a]);
function baseRecomendada(){
  const fav = baseDeFavoritos(); if(fav) return {b:fav, por:'por los perfumes que usás'};
  const v = id => P.v[id] ?? 0, mejor = Math.max(...BASES.map(v));
  let cand = BASES.filter(b=>v(b)===mejor);
  if(cand.length > 1){
    const S = {}; FAM.forEach(([k])=>S[k]=0);
    C.filter(c=>c.et!=='fon' && P.v[c.id]===3).forEach(c=>Object.entries(c.w).forEach(([k,w])=>S[k]+=w));
    const afin = b => Object.entries(X[b].w).reduce((s,[k,w])=>s+S[k]*w, 0);
    cand.sort((a,b)=>afin(b)-afin(a));
  }
  return {b:cand[0], por:'por tus votos en la cata'};
}

/* ======================= motor de formulación (punto 5) ======================= */
function tope(id, f){ const t = TOPES[id]; if(!t) return Infinity; let x = t[COLB[P.principal]||0];
  if(id==='especias' && (f||{}).tabaco > 0) x = Math.min(x, 3);
  return x; }
function reparto(S){
  const o = ordenFam(S), top = o[0], tot = Object.values(S).reduce((a,b)=>a+b,0);
  if(!tot || S[top] - S[o[1]] < S[top]*0.08) return {sal:.225, cor:.375, fon:.40, perfil:null};
  if(['citrico','frutal'].includes(top)) return {sal:.25, cor:.35, fon:.40, perfil:top};
  if(top==='floral') return {sal:.20, cor:.40, fon:.40, perfil:top};
  if(['amaderado','especiado','aromatico','gourmand'].includes(top)) return {sal:.20, cor:.35, fon:.45, perfil:top};
  return {sal:.225, cor:.375, fon:.40, perfil:top};
}
function armarFondo(F, f){
  const v = id => P.v[id] ?? 0, p = P.principal;
  let vain = v('vainilla')===3 ? 5 : v('vainilla')===2 ? 3 : 0;
  const extras = P.extras.filter(b=>b!==p).slice(0,2);
  const libre = Math.max(0, 0.4*F - vain);           /* la principal lleva al menos el 60 % del fondo */
  let resto = F - vain, sec = {};
  if(extras.length===1) sec[extras[0]] = Math.min(0.3*F, libre);
  if(extras.length===2){ sec[extras[0]] = libre*0.6; sec[extras[1]] = libre*0.4; }
  const sumSec = Object.values(sec).reduce((a,b)=>a+b,0);
  let gp = resto - sumSec;
  f[p] = 0; Object.entries(sec).forEach(([b,g])=>f[b]=(f[b]||0)+g); if(vain) f.vainilla = vain;
  sumarAlFondo(f, gp);
}
function armarEtapa(et, total, f, prop){
  /* devuelve los gramos que no entran respetando los topes (pasan a otra etapa) */
  const v = id => P.v[id] ?? 0;
  let notas = C.filter(c=>c.et===et && v(c.id)>0).map(c=>c.id).sort((a,b)=>v(b)-v(a));
  if(!notas.length) notas = [REDONDEO[P.principal][et]];
  const w = {}, rol = {};
  notas.forEach(id=>{ const x = v(id) || 3;
    if(x===3){ w[id]=3; rol[id]='Principal'; } else if(x>=2){ w[id]=2; rol[id]='Secundaria'; } else { w[id]=1; rol[id]='Soporte'; }
    w[id] *= refuerzo(id); });
  let soporteLibre = false; const fuera = [];
  const cap = id => Math.min(tope(id, f), rol[id]==='Soporte' && !soporteLibre ? 3 : Infinity, id==='salvia' ? Math.max(0, 8 - (f.bruma||0)) : Infinity);
  const g = {}; const sw = notas.reduce((s,id)=>s+w[id],0); notas.forEach(id=>g[id] = total*w[id]/sw);
  const agregar = (id, r) => { if(!notas.includes(id)){ notas.push(id); g[id]=0; w[id]=1; rol[id]=r; } };
  const libres = () => notas.filter(id=>g[id] < cap(id) - 0.005 && (rol[id]!=='Soporte' || soporteLibre));
  /* reparte "x" gramos entre las que tienen lugar; devuelve lo que no entra */
  const colocar = x => {
    for(let it=0; it<20 && x > 0.004; it++){
      let lib = libres();
      if(!lib.length){ const u = UNIVERSAL[et]; if(!notas.includes(u) && v(u)!==0) agregar(u, 'Redondeo'); lib = libres(); }
      if(!lib.length && !soporteLibre){ soporteLibre = true; lib = libres(); }
      if(!lib.length){ const otra = C.find(c=>c.et===et && !notas.includes(c.id) && !fuera.includes(c.id) && v(c.id)>0); if(otra){ agregar(otra.id, 'Redondeo'); lib = libres(); } }
      if(!lib.length) return x;
      const lw = lib.reduce((s,id)=>s+w[id],0); let resto = 0;
      lib.forEach(id=>{ const quiere = x*w[id]/lw, entra = Math.min(quiere, cap(id) - g[id]); g[id] += entra; resto += quiere - entra; });
      x = resto;
    }
    return Math.max(0, x);
  };
  let sob = 0; notas.forEach(id=>{ const c = cap(id); if(g[id] > c){ sob += g[id]-c; g[id] = c; } });
  let sobra = colocar(sob);
  notas.forEach(id=>{ if(rol[id]==='Soporte' && g[id] < 1) g[id] = 1; });
  if(et==='sal'){
    /* los dos cítricos: hasta 18 g entre los dos */
    const cit = (g.bergamota||0) + (g.citrico||0);
    if(cit > 18){ const k = 18/cit; ['bergamota','citrico'].forEach(id=>{ if(g[id]) g[id]*=k; }); sobra += colocar(cit - 18); }
    /* Bruma de mar con soporte cítrico del doble */
    if(g.bruma){
      let sop = ['bergamota','citrico'].find(id=>notas.includes(id) && v(id)!==0) || (v('bergamota')!==0 ? 'bergamota' : v('citrico')!==0 ? 'citrico' : null);
      if(!sop && notas.some(id=>id!=='bruma' && g[id] > 0.004)){ const x = g.bruma; g.bruma = 0; notas = notas.filter(id=>id!=='bruma'); fuera.push('bruma'); sobra += colocar(x); }   /* sin cítrico que la sostenga, la Bruma no entra */
      else {
        sop = sop || 'bergamota';
        agregar(sop, 'Soporte de la Bruma');
        const falta = 2*g.bruma - ((g.bergamota||0) + (g.citrico||0));
        if(falta > 0){
          const lugar = cap(sop) - g[sop], pasa = Math.min(falta, Math.max(0, lugar));
          const otros = notas.filter(id=>!['bruma','bergamota','citrico'].includes(id) && g[id] > 1), disp = otros.reduce((s,id)=>s+g[id]-1,0);
          const quita = Math.min(pasa, disp); otros.forEach(id=>g[id] -= disp ? quita*(g[id]-1)/disp : 0); g[sop] += quita;
          const aun = 2*g.bruma - ((g.bergamota||0) + (g.citrico||0));
          if(aun > 0.005){ const nb = ((g.bergamota||0) + (g.citrico||0))/2; sobra += colocar(g.bruma - nb); g.bruma = nb; }
        }
      }
    }
  }
  /* cerrar la etapa: lo que sobra por mínimos de soporte se descuenta de la más grande */
  let suma = notas.reduce((s,id)=>s+(g[id]||0),0), objetivo = total - sobra;
  if(suma > objetivo + 0.001){ const k = notas.filter(id=>g[id]>1).sort((a,b)=>g[b]-g[a])[0]; if(k) g[k] -= suma - objetivo; }
  else if(suma < objetivo - 0.001){ sobra += colocar(objetivo - suma); }
  notas.forEach(id=>{ if(g[id] > 0.004){ f[id] = (f[id]||0) + g[id]; prop.rol[id] = rol[id]==='Soporte' && soporteLibre ? 'Secundaria' : rol[id]; } });
  return sobra;
}
function sumarAlFondo(f, x){
  if(x <= 0.004) return;
  const p = P.principal, v = id => P.v[id] ?? 0;
  const otras = Object.keys(f).filter(k=>X[k].base && k!==p);
  const tp = TOPE_BASE;   /* por stock: ninguna base pasa de 22 g por perfume (Tabaco y Pimienta, además, es la más tenaz) */
  if((f[p]||0) + x <= tp){ f[p] = (f[p]||0) + x; return; }
  const entra = Math.max(0, tp - (f[p]||0)); f[p] = (f[p]||0) + entra; x -= entra;
  /* lo que falta va a Vainilla Crema (si la votó) o a otra base */
  if(v('vainilla') > 0){ const add = Math.min(x, 6 - (f.vainilla||0)); if(add > 0){ f.vainilla = (f.vainilla||0) + add; x -= add; } }
  if(x <= 0.004) return;
  if(otras.length){ otras.forEach(k=>f[k] += x/otras.length); return; }
  const otra = BASES.filter(b=>b!==p && v(b) > 0).sort((a,b)=>v(b)-v(a))[0];
  if(otra){ f[otra] = (f[otra]||0) + x; return; }
  f[p] += x;   /* no le gustó ninguna otra base: queda en la principal (el perfumista decide) */
}
function proponer(){
  const S = perfilCata(), R = reparto(S), T = CONFIG.TOTAL_G, f = {}, prop = {rol:{}, perfil:R.perfil, rep:R};
  armarFondo(T*R.fon, f);
  const s1 = armarEtapa('sal', T*R.sal, f, prop);
  const s2 = armarEtapa('cor', T*R.cor + s1, f, prop);
  sumarAlFondo(f, s2);
  return {f:redondear(f, T), rol:prop.rol, rep:R};
}
function redondear(f, T){
  const o = {}; Object.entries(f).forEach(([k,g])=>{ if(g > 0.004) o[k] = r2(g); });
  if(T){ const s = r2(Object.values(o).reduce((a,b)=>a+b,0)); if(s !== T){ const k = Object.keys(o).sort((a,b)=>o[b]-o[a])[0]; o[k] = r2(o[k] + T - s); } }
  return o;
}
const sumaEt = (f, et) => r2(Object.entries(f).filter(([k])=>X[k].et===et).reduce((s,[,g])=>s+g,0));
const sumaT = f => r2(Object.values(f).reduce((a,b)=>a+b,0));
function personalidad(f){
  const S = {}; FAM.forEach(([k])=>S[k]=0);
  Object.entries(f).forEach(([id,g])=>Object.entries(X[id].w).forEach(([k,w])=>S[k] += g*w));
  const o = ordenFam(S), frase = S[o[0]] ? FAMN[o[0]] + (S[o[1]] ? ' ' + ADJ[o[1]] : '') : '';
  return {S, o, frase};
}
function avisos(f){
  const a = {}, T = sumaT(f) || 1;
  Object.entries(f).forEach(([id,g])=>{ if(g > tope(id,f) + 0.001) a[id] = 'Esta nota es muy potente: puede tapar al resto.';
    if(X[id].base && g > TOPE_BASE + 0.001) a[id] = 'Mucha cantidad de una sola base: hablá con el perfumista antes de pesarla, o sumá otra base.'; });
  if(f.bruma && ((f.bergamota||0)+(f.citrico||0)) < 2*f.bruma) a.bruma = 'Sumá Bergamota o Acorde Cítrico para darle soporte.';
  if(f.bruma && f.salvia && f.bruma + f.salvia > 8) a.salvia = 'Bruma de mar y Salvia y Maderas juntas no deberían pasar de 8 g.';
  const et = [];
  [['fon',.40,.45,'el fondo','más pesado','más liviano y menos duradero'],['cor',.35,.40,'el corazón','más intenso en el centro','con menos cuerpo'],['sal',.20,.25,'la salida','muy chispeante al principio','con una entrada más suave']].forEach(([k,mi,ma,t,mas,menos])=>{
    const p = sumaEt(f,k)/T; if(p > ma + .005) et.push(`${t[0].toUpperCase()+t.slice(1)} quedó en ${Math.round(p*100)} %: tu perfume va a ser ${mas}.`);
    else if(p < mi - .005) et.push(`${t[0].toUpperCase()+t.slice(1)} quedó en ${Math.round(p*100)} %: tu perfume va a ser ${menos}.`); });
  return {notas:a, etapas:et};
}

/* ======================= gráficos ======================= */
function svgPiramide(f, alto){
  const T = sumaT(f) || 1, p = {sal:sumaEt(f,'sal')/T, cor:sumaEt(f,'cor')/T, fon:sumaEt(f,'fon')/T};
  const W = 200, H = alto || 170, xAt = y => (W/2) * (y/H);
  let y = 0, out = '';
  [['sal','#C9B48A'],['cor','#8FA58F'],['fon','#2F4A3A']].forEach(([k,col])=>{
    const h = H*p[k], y2 = y + h, x1 = xAt(y), x2 = xAt(y2);
    out += `<path d="M${W/2-x1},${y} L${W/2+x1},${y} L${W/2+x2},${y2} L${W/2-x2},${y2} Z" fill="${col}" stroke="#F6F1E7" stroke-width="2"/>`;
    if(h > 14) out += `<text x="${W/2}" y="${y + h/2 + (k==='sal'?h*0.18:0) + 4}" text-anchor="middle" font-size="${k==='sal'?10:12}" font-family="Montserrat" font-weight="600" fill="${k==='fon'?'#fff':'#151412'}">${ETN[k]} ${Math.round(p[k]*100)} %</text>`;
    y = y2; });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Pirámide: salida ${Math.round(p.sal*100)} %, corazón ${Math.round(p.cor*100)} %, fondo ${Math.round(p.fon*100)} %">${out}</svg>`;
}
function svgRadar(S){
  const R = 70, cx = 100, cy = 92, n = FAM.length, max = Math.max(...Object.values(S), 0.0001);
  const pt = (i, r) => [cx + r*Math.sin(2*Math.PI*i/n), cy - r*Math.cos(2*Math.PI*i/n)];
  let g = '';
  [0.33,0.66,1].forEach(k=>g += `<polygon points="${FAM.map((_,i)=>pt(i,R*k).join(',')).join(' ')}" fill="none" stroke="#E4DACA"/>`);
  FAM.forEach(([k,t],i)=>{ const [x,y] = pt(i,R), [lx,ly] = pt(i,R+14); g += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#E4DACA"/><text x="${lx}" y="${ly+3}" text-anchor="middle" font-size="8.5" font-family="Montserrat" fill="#6E665C">${t}</text>`; });
  g += `<polygon points="${FAM.map(([k],i)=>pt(i, R*S[k]/max).join(',')).join(' ')}" fill="rgba(176,138,78,.35)" stroke="#B08A4E" stroke-width="2"/>`;
  return `<svg viewBox="-24 0 248 184" role="img" aria-label="Personalidad del perfume">${g}</svg>`;
}
function bloqueViz(f, compacto){
  const pe = personalidad(f), ev = ['sal','cor','fon'].map(et=>Object.entries(f).filter(([k])=>X[k].et===et).sort((a,b)=>b[1]-a[1]).slice(0,2).map(([k])=>X[k].n).join(' y ') || '—');
  if(compacto) return `<div class="viz">${svgPiramide(f,120)}<div><div class="eb">Personalidad</div><div class="frase" style="text-align:left;font-size:19px">${esc(pe.frase)}</div><div style="font-size:13px;color:var(--dim)">Total ${fg(sumaT(f))} g</div></div></div>`;
  return `<div class="card"><div class="frase">${esc(pe.frase)}</div><div class="viz">${svgPiramide(f)}${svgRadar(pe.S)}</div>
    <div class="evol"><div><b>Al ponértelo</b><span>${esc(ev[0])}</span></div><div><b>A la hora</b><span>${esc(ev[1])}</span></div><div><b>Al final del día</b><span>${esc(ev[2])}</span></div></div></div>`;
}

/* ======================= planilla ======================= */
function fila(){
  const voto = id => { const v = P.v[id]; return v==null ? '' : VOTOS.find(x=>x[0]===v)[2]; };
  const S = perfilCata(), top3 = ordenFam(S).slice(0,3).filter(k=>S[k]>0).map(k=>FAMN[k]).join(', ');
  const f = P.f || {}, txt = o => Object.entries(o||{}).map(([k,g])=>`${X[k]?X[k].n:k}: ${fg(g)} g`).join('; ');
  const pe = P.f ? personalidad(P.f) : null, rec = baseRecomendada();
  const cols = [['ID',P.id],['Fecha y hora',P.creado],['Última actualización',new Date().toLocaleString('es-AR')],['Estado',P.est||''],['Nombre',P.nom.trim()],['WhatsApp',P.wa.trim()],
    ['Perfumes favoritos',P.perf.filter(x=>x&&x.trim()).join(' | ')]];
  C.forEach(c=>cols.push(['Voto · '+c.n, voto(c.id)]));
  C.forEach(c=>cols.push(['Emociones · '+c.n, (P.emo[c.id]||[]).join(', ')]));
  C.forEach(c=>cols.push(['Recuerdo · '+c.n, P.rec[c.id]||'']));
  cols.push(['Perfil aromático (top 3)', top3], ['Base recomendada', X[rec.b].n], ['Base elegida', P.principal ? X[P.principal].n : ''],
    ['Segunda base', P.extras[0] ? X[P.extras[0]].n : ''], ['Tercera base', P.extras[1] ? X[P.extras[1]].n : ''],
    ['Fórmula completa', txt(f)], ['Gramos fondo', P.f ? fg(sumaEt(f,'fon')) : ''], ['Gramos corazón', P.f ? fg(sumaEt(f,'cor')) : ''], ['Gramos salida', P.f ? fg(sumaEt(f,'sal')) : ''],
    ['Nombre del perfume', P.pn.trim()], ['Modo final', P.f ? P.modo : ''], ['Fórmula propuesta por la app', txt(P.guiada)],
    ['Toque del perfumista', Object.entries(P.toque).filter(([,g])=>g>0).map(([k,g])=>`${TOQUE.find(t=>t[0]===k)[1]}: ${fg(g)} g`).join('; ')],
    ['Personalidad', pe ? pe.frase + ' · ' + pe.o.slice(0,3).filter(k=>pe.S[k]>0).map(k=>FAMN[k]).join(', ') : ''], ['Dispositivo', P.dev]);
  return {clave:CONFIG.CLAVE, hoja:CONFIG.HOJA, id:P.id, t:Date.now(), columnas:cols};
}
function registrar(estado){ P.est = estado; guardar();
  const cola = LS.get(CONFIG.LS+'_cola',[]).filter(r=>r.id!==P.id); cola.push(fila()); LS.set(CONFIG.LS+'_cola', cola); vaciar(); }
let enviando = false;
/* un envío solo sale de la cola cuando llegó: con respuesta del script, o al menos con el pedido entregado (no-cors) */
async function vaciar(){
  if(enviando) return; enviando = true;
  try{
    for(const r of LS.get(CONFIG.LS+'_cola',[])){
      let ok = false; const body = JSON.stringify(r);
      try{ const resp = await fetch(CONFIG.SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body}); const j = await resp.json(); ok = !!j.ok; }catch(e){}
      if(!ok){ try{ await fetch(CONFIG.SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body}); ok = true; }catch(e){} }
      if(ok) LS.set(CONFIG.LS+'_cola', LS.get(CONFIG.LS+'_cola',[]).filter(x=>!(x.id===r.id && x.t===r.t)));
      else break;
    }
  } finally { enviando = false; }
}

function prepararBase(){

      return `<div class="etapa"><h3><span>${ETN[et]}</span><span>${fg(sumaEt(f,et))} g · ${Math.round(100*sumaEt(f,et)/(T||1))} %</span></h3>${l.map(fila).join('') || '<p class="sub" style="padding:8px 0">Sin componentes</p>'}</div>`; }).join('')}
    ${faltan.length ? `<div class="sumar"><select id="sumar" aria-label="Agregar componente"><option value="">Agregar un componente…</option>${['sal','cor','fon'].map(et=>`<optgroup label="${ETN[et]}">${faltan.filter(c=>c.et===et).map(c=>`<option value="${c.id}">${esc(c.n)}${P.v[c.id]===0?' (no te gustó)':''}</option>`).join('')}</optgroup>`).join('')}</select>
      <button class="btn" style="margin:0;width:auto;padding:12px 18px" onclick="sumarComp()">Sumar</button></div>` : ''}
    <label class="libre"><input type="checkbox" ${P.libre?'checked':''} onchange="P.libre=this.checked;guardar();pintar()"> Total libre (no compensa automáticamente)</label>
    <div class="total"><span>Total</span><span>${fg(T)} g ${P.libre && Math.abs(dif)>0.001 ? `<small style="color:var(--warn)">(${dif>0?'faltan':'sobran'} ${fg(Math.abs(dif))} g)</small>` : ''}</span></div></div>`;
}
function ajustar(k, nuevoG){
  const f = P.f, viejo = f[k] || 0; nuevoG = Math.max(0, r2(nuevoG)); let d = r2(nuevoG - viejo);
  if(!d) return;
  if(!P.libre){
    let otros = Object.keys(f).filter(x=>x!==k && X[x].et===X[k].et && f[x]>0);
    if(!otros.length) otros = Object.keys(f).filter(x=>x!==k && f[x]>0);
    const disp = otros.reduce((s,x)=>s+f[x],0);
    if(d > disp){ d = disp; nuevoG = r2(viejo + d); }
    otros.forEach(x=>{ f[x] = r2(f[x] - d * f[x]/disp); if(f[x] < 0) f[x] = 0; });
  }
  f[k] = nuevoG;
  if(!P.libre){ const s = r2(sumaT(f) - CONFIG.TOTAL_G); if(s){ const big = Object.keys(f).filter(x=>x!==k).sort((a,b)=>f[b]-f[a])[0] || k; f[big] = r2(f[big] - s); } }
  Object.keys(f).forEach(x=>{ if(f[x] <= 0 && x!==k) delete f[x]; });
  guardar(); const y = window.scrollY; pintar(); window.scrollTo(0,y);
}
const mover = (k,d) => ajustar(k, (P.f[k]||0) + d);
const escribir = (k,v) => { const n = parseFloat(String(v).replace(',','.')); if(isNaN(n)){ pintar(); return; } ajustar(k, n); };
function quitar(k){ const g = P.f[k]; delete P.f[k];
  if(!P.libre && g){ let otros = Object.keys(P.f).filter(x=>X[x].et===X[k].et); if(!otros.length) otros = Object.keys(P.f); const s = otros.reduce((a,x)=>a+P.f[x],0) || 1; otros.forEach(x=>P.f[x] = r2(P.f[x] + g*P.f[x]/s)); const dd = r2(sumaT(P.f)-CONFIG.TOTAL_G); if(dd && otros.length){ const b = otros.sort((a,b)=>P.f[b]-P.f[a])[0]; P.f[b] = r2(P.f[b]-dd); } }
  guardar(); pintar(); }
function sumarComp(){ const id = $('#sumar').value; if(!id) return; P.f[id] = 0; ajustar(id, X[id].base ? 4 : 1); }
function volverPropuesta(){ if(!confirm('¿Volver a la fórmula que te propuso la app? Se pierden tus cambios.')) return; P.f = Object.assign({}, P.guiada); P.modo='guiado'; guardar(); ir('guiado'); }
function labListo(){ P.modo = 'lab'; registrar('Fórmula'); ir('pesar'); }

/* ---------- pesar ---------- */
function vPesar(){
  const f = P.f, toque = Object.entries(P.toque).filter(([,g])=>g>0);
  fijo(`<button class="btn" onclick="ir('nombre')">Seguir</button>`);
  return `<div class="eb">Paso 3 · Pesá tu perfume</div><h1>Tu fórmula para pesar</h1>
    <p class="sub">En este orden: fondo, corazón y salida. Tocá ✓ cuando termines cada uno.</p>
    ${Object.entries(f).some(([k,g])=>X[k].base && g > TOPE_BASE + 0.001) ? `<div class="aviso">✋ Tu fórmula lleva mucha cantidad de una base. <b>Hablá con el perfumista</b> antes de pesarla.</div>` : ''}
    <label class="libre"><input type="checkbox" ${P.ml?'checked':''} onchange="P.ml=this.checked;guardar();pintar()"> Ver en ml (micropipeta)</label>
    ${listaFormula(f,{pesar:true})}<div class="total"><span>Total</span><span>${P.ml ? fg(sumaT(f)/CONFIG.DENSIDAD)+' ml' : fg(sumaT(f))+' g'}</span></div>
    ${toque.length ? `<div class="etapa"><h3><span>Toque del perfumista</span></h3>${toque.map(([k,g])=>`<div class="fl"><div class="n"><b>${esc(TOQUE.find(t=>t[0]===k)[1])}</b></div><span class="g">${fg(g)} g</span></div>`).join('')}</div>` : ''}
    <button class="btn ghost" style="margin-top:20px" onclick="pedirPin(abrirToque)">Toque del perfumista</button>`;
}
function tick(k){ P.pesado[k] = !P.pesado[k]; guardar(); const y = window.scrollY; pintar(); window.scrollTo(0,y); }
function abrirToque(){
  const d = document.createElement('div'); d.className = 'modal'; d.setAttribute('role','dialog'); d.setAttribute('aria-label','Toque del perfumista');
  d.innerHTML = `<div class="caja"><div class="eb">Toque del perfumista</div><p class="sub" style="font-size:14px">Hasta 3,00 g en total. No sale en la imagen final.</p>
    ${TOQUE.map(([k,t])=>`<div class="fld"><label for="t_${k}">${t}</label><input id="t_${k}" inputmode="decimal" value="${P.toque[k] ? fg(P.toque[k]) : ''}" placeholder="0,00"></div>`).join('')}
    <button class="btn" id="tok">Guardar</button><button class="btn ghost" onclick="this.closest('.modal').remove()">Cancelar</button></div>`;
  document.body.appendChild(d);
  d.querySelector('#tok').onclick = () => { const t = {}; let s = 0;
    TOQUE.forEach(([k])=>{ const n = parseFloat(d.querySelector('#t_'+k).value.replace(',','.')) || 0; t[k] = r2(Math.max(0,n)); s += t[k]; });
    if(s > 3.001){ aviso('El total no puede pasar de 3,00 g'); return; }
    P.toque = t; d.remove(); registrar('Fórmula'); pintar(); };
}

/* ---------- nombre ---------- */
function vNombre(){
  fijo(`<button class="btn" id="go" ${P.pn.trim()?'':'disabled'} onclick="terminar()">Crear mi imagen</button>`);
  return `<div class="eb">Paso 4</div><h1>Nombrá tu perfume</h1>
    ${P.pnLista ? `<p class="sub">Es el nombre que va en la etiqueta de tu frasco.</p>` : ''}
    <div class="fld"><input id="pn" maxlength="24" value="${esc(P.pn)}" placeholder="Nombre del perfume" style="font-family:var(--script);font-size:28px;text-align:center" oninput="P.pn=this.value;P.pnEditado=true;guardar();$('#go').disabled=!this.value.trim();$('#cpn').textContent=this.value.length+'/24'"><div class="cuenta" id="cpn">${P.pn.length}/24</div></div>`;
}
function terminar(){ registrar('Terminó'); ir('final'); }

/* ---------- imagen final ---------- */
const IMGOBJ = {};
function img(k){ if(IMGOBJ[k]) return IMGOBJ[k]; IMGOBJ[k] = new Promise(r=>{ const i = new Image(); i.onload = ()=>r(i); i.onerror = ()=>r(null); i.src = foto(k); }); return IMGOBJ[k]; }
/* notas que se ven en la imagen: las simples por su nombre y los acordes/bases desarmados en su pirámide (como en Caro Cuomo) */
const NOMBRE_NOTA = {rosa:'Rosa', vainilla:'Vainilla', bruma:'Bruma de mar'};
function piramideNotas(f){
  const o = {sal:[], cor:[], fon:[]}, vistos = [];
  const add = (et, t, g) => { t = t.trim(); if(!t) return; const k = nz(t); if(vistos.some(v=>v===k || v.startsWith(k+' ') || k.startsWith(v+' '))) return; vistos.push(k); o[et].push([t.charAt(0).toUpperCase()+t.slice(1), g]); };
  const parte = txt => txt.split(/,| y | e /).map(x=>x.trim()).filter(Boolean);
  Object.entries(f).sort((a,b)=>b[1]-a[1]).forEach(([id,g])=>{
    const c = X[id];
    if(c.pir){ c.pir.split(' · ').forEach(seg=>{ const m = seg.match(/^(Salida|Corazón|Fondo):\s*(.*)$/); if(!m) return;
        const et = {Salida:'sal', 'Corazón':'cor', Fondo:'fon'}[m[1]]; parte(m[2]).forEach(t=>add(et, t, g)); }); }
    else add(c.et, NOMBRE_NOTA[id] || c.n, g + 1000);   /* las notas que eligió van primero */
  });
  ['sal','cor','fon'].forEach(et=>{ o[et] = o[et].sort((a,b)=>b[1]-a[1]).slice(0,7).map(x=>x[0]); });
  return o;
}
async function dibujar(cv){
  try{ await Promise.all(['300 40px Montserrat','400 40px Montserrat','500 40px Montserrat','600 40px Montserrat','italic 400 40px "Lobster Two"'].map(f=>document.fonts.load(f))); }catch(e){}
  const c = cv.getContext('2d'), W = 1080, H = 1528, f = P.f, pe = personalidad(f);
  c.fillStyle = '#F7F1E6'; c.fillRect(0,0,W,H);
  c.strokeStyle = '#B08A4E'; c.lineWidth = 2; c.strokeRect(36,36,W-72,H-72);
  c.strokeStyle = 'rgba(176,138,78,.4)'; c.lineWidth = 1; c.strokeRect(50,50,W-100,H-100);
  const sp = (t, x, y, px, wt, col, track, al) => { c.font = `${wt} ${px}px Montserrat`; c.fillStyle = col; c.textAlign = al||'center';
    try{ c.letterSpacing = track+'px'; }catch(e){} c.fillText(t, x, y); try{ c.letterSpacing = '0px'; }catch(e){} };
  /* encabezado como la etiqueta: empresa, nombre del perfume, línea, creado por */
  sp(CONFIG.EMPRESA.toUpperCase(), W/2, 116, 24, 400, '#B08A4E', 12);
  let px = 112; c.font = `italic 400 ${px}px "Lobster Two"`; while(c.measureText(P.pn.trim()).width > W-200 && px > 56){ px -= 4; c.font = `italic 400 ${px}px "Lobster Two"`; }
  c.fillStyle = '#151412'; c.textAlign = 'center'; c.fillText(P.pn.trim(), W/2, 236);
  c.strokeStyle = '#B08A4E'; c.lineWidth = 3; c.beginPath(); c.moveTo(W/2-140,272); c.lineTo(W/2+140,272); c.stroke();
  sp('creado por ' + P.nom.trim(), W/2, 320, 25, 400, '#151412', 1);
  sp((pe.frase || '').toUpperCase(), W/2, 362, 19, 600, '#2F4A3A', 6);
  /* los aromas en pirámide: salida arriba, corazón al medio, fondo abajo; más grande cuanto más gramos */
  const filas = ['sal','cor','fon'].map(et=>Object.entries(f).filter(([k])=>X[k].et===et).sort((a,b)=>b[1]-a[1]).slice(0, et==='fon' ? 4 : 5));
  const ims = await Promise.all(filas.flat().map(([k])=>img(X[k].img))); let n = 0;
  const filasIm = filas.map(l=>l.map(([k,g])=>({k, g, im: ims[n++]})));
  const gmax = Math.max(...Object.values(f)), Y0 = 400, Y1 = 1060, filasCon = filasIm.filter(l=>l.length), FH = (Y1-Y0)/Math.max(1,filasCon.length);
  const dibujos = [];
  filasCon.forEach((l, fi)=>{
    const alto = FH*1.55, base = l.map(x=>{ const t = alto*(0.58 + 0.42*Math.sqrt(x.g/gmax)); const im = x.im; if(!im) return {x, w:0, h:0};
      const k = Math.min(t/im.height, t*1.15/im.width); return {x, w:im.width*k, h:im.height*k}; });
    /* la más grande al centro, las demás a los costados */
    const ord = []; base.forEach((b,i)=>{ if(i%2) ord.unshift(b); else ord.push(b); });
    let solape = 0.26, total = ord.reduce((s,b)=>s+b.w,0) - solape*ord.slice(1).reduce((s,b)=>s+b.w,0);
    const maxW = W - 110; let esc = total > maxW ? maxW/total : 1;
    const cy = Y0 + FH*fi + FH/2; let x = W/2 - total*esc/2;
    ord.forEach((b,i)=>{ const w = b.w*esc, h = b.h*esc; dibujos.push({im:b.x.im, x, y:cy-h/2, w, h, g:b.x.g, fi}); x += w*(1-solape); });
  });
  /* primero el fondo, después corazón y salida; dentro de cada fila, las chicas atrás */
  dibujos.forEach(d=>{ if(d.y + d.h > 1080) d.y = 1080 - d.h; if(d.y < 372) d.y = 372; });
  dibujos.sort((a,b)=>b.fi-a.fi || a.g-b.g).forEach(d=>{ if(d.im) c.drawImage(d.im, d.x, d.y, d.w, d.h); });
  /* las notas, como en Fragrantica: salida, corazón y fondo */
  const pr = piramideNotas(f), cw = (W-140)/3, top = 1110, TIT = {sal:'Notas de salida', cor:'Notas de corazón', fon:'Notas de fondo'};
  ['sal','cor','fon'].forEach((et,i)=>{
    const x = 70 + cw*i + cw/2;
    sp(TIT[et].toUpperCase(), x, top, 16, 600, '#B08A4E', 3);
    c.strokeStyle = '#B08A4E'; c.lineWidth = 1.2; c.beginPath(); c.moveTo(x-24, top+14); c.lineTo(x+24, top+14); c.stroke();
    pr[et].forEach((t,j)=>{ let s = 21; c.font = `400 ${s}px Montserrat`; while(c.measureText(t).width > cw-20 && s > 15){ s--; c.font = `400 ${s}px Montserrat`; } sp(t, x, top + 48 + j*31, s, 400, '#151412', .3); });
    if(i>0){ c.strokeStyle = 'rgba(176,138,78,.35)'; c.lineWidth = 1; c.beginPath(); c.moveTo(70+cw*i, top-20); c.lineTo(70+cw*i, top+250); c.stroke(); }
  });
  /* pie: evento, web y firma */
  sp(`Evento ${CONFIG.EMPRESA} · ${CONFIG.FECHA} · ${CONFIG.WEB}`.toUpperCase(), W/2, 1400, 15, 400, '#6E665C', 3);
  c.strokeStyle = '#B08A4E'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(W/2-70,1424); c.lineTo(W/2+70,1424); c.stroke();
  sp(`${CONFIG.PERFUMISTA} · ${CONFIG.MATRICULA}`.toUpperCase(), W/2, 1456, 15, 500, '#151412', 3);
}
function vFinal(){
  const dev = P.devElegido || (P.dev==='iOS' ? 'iOS' : P.dev==='Android' ? 'Android' : 'iOS');
  fijo(`<button class="btn gold" onclick="descargar()">Descargar mi perfume</button>`);
  setTimeout(()=>{ const cv = $('#cv'); if(cv) dibujar(cv); }, 0);
  return `<div class="eb">Tu perfume</div><h1>${esc(P.pn.trim())}</h1>
    ${embebido() ? `<div class="aviso">Estás dentro de otra app. Para guardar la imagen, abrí este link en ${P.dev==='Android'?'Chrome':'Safari'} (menú ⋯ → "Abrir en el navegador").</div>` : ''}
    <canvas id="cv" width="1080" height="1528" style="margin-top:12px" aria-label="Imagen de tu perfume"></canvas>
    <h2>¿Tu celular es iPhone o Android?</h2>
    <div class="seg"><button aria-pressed="${dev==='iOS'}" onclick="P.devElegido='iOS';guardar();pintar()">iPhone</button><button aria-pressed="${dev==='Android'}" onclick="P.devElegido='Android';guardar();pintar()">Android</button></div>
    <p class="sub" style="font-size:14px;margin-top:10px">${dev==='iOS' ? 'Se abre el menú de compartir: tocá <b>Guardar imagen</b>.' : 'La imagen se descarga y queda en tu galería (carpeta Descargas).'}</p>
    <button class="btn ghost" onclick="ir('gracias')">Terminar</button>`;
}
async function blobImagen(){ const cv = document.createElement('canvas'); cv.width = 1080; cv.height = 1528; await dibujar(cv); return new Promise(r=>cv.toBlob(r,'image/png')); }
async function descargar(){
  const dev = P.devElegido || P.dev, blob = await blobImagen(), nom = 'perfume_' + (nz(P.pn)||'mi_perfume').replace(/ /g,'_') + '.png';
  const file = new File([blob], nom, {type:'image/png'});
  const bajar = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nom; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 4000); };
  if(dev==='Android'){ bajar(); aviso('Imagen descargada'); setTimeout(()=>ir('gracias'), 1200); return; }
  try{ if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:P.pn}); ir('gracias'); return; } }
  catch(e){ if(e && e.name==='AbortError') return; }
  /* iPhone sin compartir: imagen a pantalla completa para mantener presionado */
  const u = URL.createObjectURL(blob), d = document.createElement('div'); d.className = 'full';
  d.innerHTML = `<img src="${u}" alt="Tu perfume"><p>Mantené presionada la imagen y tocá <b>"Guardar en Fotos"</b>.</p><button class="btn gold" style="max-width:320px" onclick="this.closest('.full').remove();ir('gracias')">Listo</button>`;
  document.body.appendChild(d);
}
function vGracias(){
  fijo('');
  return `<div style="text-align:center;padding-top:8vh"><div class="eb">Gracias</div><h1 style="font-family:var(--script);font-size:44px;font-weight:400">${esc(P.pn.trim())}</h1>
    <p class="sub" style="margin-top:12px">Gracias por crear tu perfume con nosotros, ${esc(P.nom.trim().split(' ')[0])}.</p>
    <p class="sub" style="margin-top:8px">Llevate tu frasco con su etiqueta y la imagen de tu perfume en el celular.</p>
    <p style="margin-top:28px;font-size:13px;letter-spacing:4px;text-transform:uppercase">${esc(CONFIG.EMPRESA)} · ${esc(CONFIG.FECHA)}</p>
    <p style="margin-top:6px;font-size:13px;letter-spacing:2px;color:var(--gold)">${esc(CONFIG.WEB)}</p>
    <button class="btn ghost" style="margin-top:40px" onclick="ir('final')">Volver a mi imagen</button>
    <button class="btn ghost" style="margin-top:10px;border-color:var(--line);color:var(--dim)" onclick="reiniciar()">Empezar de nuevo (otra persona)</button></div>`;
}
function reiniciar(){ if(!confirm('¿Empezar de cero? Lo de esta persona ya quedó guardado en la planilla.')) return; vaciar(); P = nuevo(); guardar(); pintar(); window.scrollTo(0,0); }

function pintar(){
  if(!PASOS.includes(P.paso) || P.paso==='inicio') P.paso = 'datos';
  if(['intro','cata','perfil','pausa','base','guiado','lab','pesar','nombre','final','gracias'].includes(P.paso) && !(P.nom.trim())) P.paso = 'datos';
  if(['guiado','lab'].includes(P.paso) && !P.principal) prepararBase();
  if(['pesar','nombre','final','gracias'].includes(P.paso) && !P.f) P.paso = P.principal ? 'guiado' : 'base';
  if(['final','gracias'].includes(P.paso) && !P.pn.trim()) P.paso = 'nombre';
  barraTop();
  const V = {datos:vDatos, intro:vIntro, cata:vCata, perfil:vPerfil, pausa:vPausa, base:vBase, guiado:vGuiado, lab:vLab, pesar:vPesar, nombre:vNombre, final:vFinal, gracias:vGracias};
  $('#app').innerHTML = V[P.paso]();
}
pintar(); vaciar();
</script>
