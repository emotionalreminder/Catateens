<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F2A2E">
<title>Armador de fórmulas</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F3EE; --card:#FFFFFF; --ink:#1F2A2E; --dim:#69737A; --line:#E3DDD3; --soft:#EFEAE1;
  --accent:#3D6B5E; --accent-ink:#FFFFFF; --warn:#B4532A; --warn-bg:#FBEDE5; --ok-bg:#E7F1EC;
  --salida:#D3A11F; --corazon:#B85C7E; --fondo:#6E4A33;
  --top:#1F2A2E; --top-ink:#F2EEE6;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14191B; --card:#1D2427; --ink:#ECE8E1; --dim:#9AA3A8; --line:#2E383C; --soft:#252E31;
    --accent:#6FAF9C; --accent-ink:#0F1513; --warn:#E58A62; --warn-bg:#3A2219; --ok-bg:#1C3029;
    --salida:#E6BC4A; --corazon:#D987A6; --fondo:#B98A6A;
    --top:#0E1214; --top-ink:#ECE8E1;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14191B; --card:#1D2427; --ink:#ECE8E1; --dim:#9AA3A8; --line:#2E383C; --soft:#252E31;
  --accent:#6FAF9C; --accent-ink:#0F1513; --warn:#E58A62; --warn-bg:#3A2219; --ok-bg:#1C3029;
  --salida:#E6BC4A; --corazon:#D987A6; --fondo:#B98A6A;
  --top:#0E1214; --top-ink:#ECE8E1;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.45;
  -webkit-tap-highlight-color:transparent;}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;}
input,select,textarea{font:inherit;color:inherit;}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;margin:0;letter-spacing:-.01em;}
.num{font-variant-numeric:tabular-nums;}

/* Top bar */
.top{position:sticky;top:0;z-index:10;background:var(--top);color:var(--top-ink);}
.top-in{max-width:880px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px;min-height:56px;}
.brand{font-family:Fraunces,Georgia,serif;font-size:19px;font-weight:600;flex:1;display:flex;align-items:center;gap:10px;min-width:0;}
.brand svg{flex:0 0 auto;}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tabs{display:flex;gap:4px;background:rgba(255,255,255,.08);padding:3px;border-radius:999px;}
.tabs button{padding:6px 14px;border-radius:999px;font-size:14px;font-weight:600;opacity:.75;}
.tabs button[aria-current="page"]{background:var(--top-ink);color:var(--top);opacity:1;}
.back{width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.22);display:grid;place-items:center;flex:0 0 auto;}

main{max-width:880px;margin:0 auto;padding:20px 16px 80px;}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
.head h1{font-size:28px;}
.head p{margin:4px 0 0;color:var(--dim);}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;}
.card h2{font-size:18px;margin-bottom:12px;}
.card h2 small{font-family:Inter,sans-serif;font-size:13px;font-weight:500;color:var(--dim);margin-left:6px;}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:12px;
  font-weight:600;font-size:14px;border:1px solid var(--line);background:var(--card);min-height:42px;}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
.btn.danger{color:var(--warn);}
.btn.small{padding:6px 12px;min-height:34px;font-size:13px;border-radius:10px;}
.btn:focus-visible,.chip:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
.field label,.lbl{font-size:13px;font-weight:600;color:var(--dim);}
.inp{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);min-height:42px;}
textarea.inp{min-height:70px;resize:vertical;}
.inp.title{font-family:Fraunces,Georgia,serif;font-size:22px;font-weight:600;background:transparent;border-color:transparent;padding:4px 6px;margin-left:-6px;}
.inp.title:hover,.inp.title:focus{border-color:var(--line);background:var(--bg);}

.chips{display:flex;flex-wrap:wrap;gap:6px;}
.chip{padding:7px 12px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:600;background:var(--bg);}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);}
.chip small{font-weight:500;opacity:.7;margin-left:4px;}

.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
@media (max-width:640px){.grid3{grid-template-columns:1fr;}}
.inline{display:flex;gap:8px;align-items:center;}
.inline .inp{flex:1;}
.unit{color:var(--dim);font-size:13px;}

/* Formula list */
.flist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;}
.fcard{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;transition:border-color .15s,transform .15s;}
.fcard:hover{border-color:var(--accent);transform:translateY(-1px);}
.fcard h3{font-size:19px;}
.fcard .meta{color:var(--dim);font-size:13px;}
.empty{text-align:center;padding:40px 16px;color:var(--dim);}
.empty h2{color:var(--ink);margin:12px 0 6px;}

/* Pyramid bar */
.pbar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--soft);}
.pbar i{display:block;height:100%;transition:width .2s;}
.pbar .s{background:var(--salida);} .pbar .c{background:var(--corazon);} .pbar .f{background:var(--fondo);}
.pbar.big{height:16px;}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;margin-top:10px;}
.legend span{display:inline-flex;align-items:center;gap:6px;}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:0 0 auto;}
.dot.salida{background:var(--salida);} .dot.corazon{background:var(--corazon);} .dot.fondo{background:var(--fondo);}

/* Ingredient rows */
.rows{display:flex;flex-direction:column;}
.row{display:grid;grid-template-columns:auto 1fr auto auto auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);}
.row:first-child{border-top:0;}
.rn{min-width:0;}
.rn b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rn small,.rv small{color:var(--dim);font-size:12px;}
.rv{text-align:right;min-width:92px;}
.rv b{display:block;font-weight:600;}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg);}
.stepper button{width:34px;height:36px;font-size:18px;font-weight:600;color:var(--dim);}
.stepper input{width:52px;text-align:center;border:0;background:transparent;height:36px;-moz-appearance:textfield;}
.stepper input::-webkit-inner-spin-button,.stepper input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
.x{width:32px;height:32px;border-radius:50%;color:var(--dim);font-size:18px;}
.x:hover{background:var(--soft);color:var(--warn);}
@media (max-width:560px){
  .row{grid-template-columns:auto 1fr auto;grid-template-areas:"d n x" "d s v";row-gap:8px;}
  .row .dot{grid-area:d;align-self:start;margin-top:6px;}
  .row .rn{grid-area:n;} .row .x{grid-area:x;} .row .stepper{grid-area:s;justify-self:start;} .row .rv{grid-area:v;}
}
.group-h{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);margin:14px 0 2px;}
.group-h:first-child{margin-top:0;}

/* Picker */
.picker{margin-top:12px;border:1px dashed var(--line);border-radius:12px;padding:12px;background:var(--bg);}
.plist{max-height:300px;overflow:auto;margin-top:10px;display:flex;flex-direction:column;gap:2px;}
.pitem{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;text-align:left;width:100%;}
.pitem:hover{background:var(--soft);}
.pitem b{font-weight:600;flex:1;}
.pitem small{color:var(--dim);font-size:12px;}
.pitem.added{opacity:.5;}

/* Results */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.stat{background:var(--bg);border-radius:12px;padding:12px;}
.stat .k{font-size:12px;color:var(--dim);font-weight:600;}
.stat .v{font-family:Fraunces,Georgia,serif;font-size:24px;font-weight:600;margin-top:2px;}
.stat .s2{font-size:12px;color:var(--dim);}
.stat .v{white-space:nowrap;}
.side .stats,.stats.compact{grid-template-columns:1fr 1fr;}
.side .stats .stat:last-child{grid-column:1 / -1;}
@media (max-width:480px){.stats{grid-template-columns:1fr 1fr;} .stats .stat:last-child{grid-column:1 / -1;}}
.hints{display:flex;flex-direction:column;gap:6px;margin-top:12px;}
.hint{padding:9px 12px;border-radius:10px;font-size:13px;background:var(--warn-bg);color:var(--ink);}
.hint.ok{background:var(--ok-bg);}
.hint b{font-weight:600;}
.tip{font-size:13px;color:var(--dim);margin:12px 0 0;}

.actions{display:flex;flex-wrap:wrap;gap:8px;}
.layout{display:grid;grid-template-columns:1fr 320px;gap:14px;align-items:start;}
.layout .side{position:sticky;top:70px;}
@media (max-width:820px){.layout{grid-template-columns:1fr;} .layout .side{position:static;}}

/* Essence library */
.lib-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);}
.lib-row:first-of-type{border-top:0;}
.lib-row b{font-weight:600;flex:1;min-width:0;}
.lib-row small{color:var(--dim);font-size:12px;}
.addform{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;align-items:end;}
@media (max-width:640px){.addform{grid-template-columns:1fr 1fr;} .addform .field:first-child{grid-column:1 / -1;} .addform .btn{grid-column:1 / -1;}}
.addform .field{margin:0;}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:all .2s;z-index:50;max-width:calc(100% - 32px);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.foot{margin-top:24px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--dim);font-size:13px;}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}

/* Print */
#print{display:none;}
@media print{
  body{background:#fff;color:#000;}
  .top,main{display:none !important;}
  #print{display:block;padding:24px;font-family:Inter,sans-serif;color:#000;}
  #print h1{font-size:26px;margin-bottom:4px;}
  #print table{width:100%;border-collapse:collapse;margin-top:16px;font-size:13px;}
  #print th,#print td{text-align:left;padding:6px 8px;border-bottom:1px solid #ccc;}
  #print td.r,#print th.r{text-align:right;}
}
</style>
</head>
<body>
<header class="top"><div class="top-in" id="topbar"></div></header>
<main id="app"></main>
<div id="print" aria-hidden="true"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept="application/json,.json" class="sr" aria-label="Importar copia de seguridad">

<script>
/* ---------- Constantes ---------- */
const NOTAS = {
  salida:  {label:'Salida',  min:15, max:30, low:'Poca salida: el arranque puede sentirse apagado.', high:'Mucha salida: el perfume va a evaporarse rápido.'},
  corazon: {label:'Corazón', min:30, max:50, low:'Poco corazón: puede sentirse hueco en el medio.', high:'Mucho corazón: puede faltarle arranque o duración.'},
  fondo:   {label:'Fondo',   min:25, max:50, low:'Poco fondo: va a durar poco en la piel.', high:'Mucho fondo: puede resultar pesado.'}
};
const NOTA_KEYS = ['salida','corazon','fondo'];
const CONC = [
  {id:'edc',    label:'Eau de Cologne',  pct:4},
  {id:'edt',    label:'Eau de Toilette', pct:10},
  {id:'edp',    label:'Eau de Parfum',   pct:18},
  {id:'parfum', label:'Extrait / Parfum',pct:25}
];
const FAMILIAS = ['Cítrica','Floral','Aromática','Especiada','Frutal','Verde','Amaderada','Ambarada','Gourmand','Almizclada','Cuero'];
const VOLS = [10,30,50,100];

const PRESET = [
  ['Bergamota','salida','Cítrica'],['Limón','salida','Cítrica'],['Naranja dulce','salida','Cítrica'],
  ['Mandarina','salida','Cítrica'],['Pomelo','salida','Cítrica'],['Menta','salida','Aromática'],
  ['Eucalipto','salida','Aromática'],['Pimienta rosa','salida','Especiada'],['Jengibre','salida','Especiada'],
  ['Manzana verde','salida','Frutal'],['Té verde','salida','Verde'],
  ['Lavanda','corazon','Aromática'],['Rosa','corazon','Floral'],['Jazmín','corazon','Floral'],
  ['Neroli','corazon','Floral'],['Azahar','corazon','Floral'],['Iris','corazon','Floral'],
  ['Ylang-ylang','corazon','Floral'],['Geranio','corazon','Floral'],['Violeta','corazon','Floral'],
  ['Canela','corazon','Especiada'],['Cardamomo','corazon','Especiada'],['Durazno','corazon','Frutal'],
  ['Coco','corazon','Gourmand'],
  ['Vainilla','fondo','Gourmand'],['Haba tonka','fondo','Gourmand'],['Caramelo','fondo','Gourmand'],
  ['Sándalo','fondo','Amaderada'],['Cedro','fondo','Amaderada'],['Vetiver','fondo','Amaderada'],
  ['Pachulí','fondo','Amaderada'],['Oud','fondo','Amaderada'],['Ámbar','fondo','Ambarada'],
  ['Benjuí','fondo','Ambarada'],['Almizcle blanco','fondo','Almizclada'],['Musgo de roble','fondo','Verde'],
  ['Cuero','fondo','Cuero']
];
const STORE_KEY = 'armador-formulas:v1';

/* ---------- Utilidades ---------- */
const uid = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = (v, d=0) => { const n = parseFloat(String(v).replace(',','.')); return isFinite(n) ? n : d; };
const fmtMl = n => n >= 10 ? n.toFixed(1).replace('.',',') : n.toFixed(2).replace('.',',');
const fmtPct = n => (Math.round(n*10)/10).toString().replace('.',',');
const fmtInt = n => Math.round(n).toLocaleString('es-AR');
const $ = (s, r=document) => r.querySelector(s);

let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2200); }

/* ---------- Estado ---------- */
let db = load();
let ui = { view:'lista', editId:null, picker:false, q:'' };

function seed(){
  const esencias = PRESET.map(([nombre,nota,familia]) => ({id:uid(), nombre, nota, familia}));
  const by = n => esencias.find(e => e.nombre === n).id;
  const ejemplo = {
    id:uid(), nombre:'Brisa de azahar', volumen:50, conc:18, gpm:20, updated:Date.now(),
    notas:'Ejemplo: cítrico luminoso con corazón blanco y fondo suave. Macerar 3 semanas.',
    items:[['Bergamota',3],['Mandarina',2],['Neroli',3],['Jazmín',2],['Azahar',2],['Almizcle blanco',3],['Sándalo',2],['Vainilla',1]]
      .map(([n,p]) => ({essId:by(n), partes:p}))
  };
  return {esencias, formulas:[ejemplo]};
}
function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){ const d = JSON.parse(raw); if(d && Array.isArray(d.esencias) && Array.isArray(d.formulas)) return d; }
  }catch(e){}
  return seed();
}
let saveT;
function save(){ clearTimeout(saveT); saveT = setTimeout(()=>{ try{ localStorage.setItem(STORE_KEY, JSON.stringify(db)); }catch(e){} }, 200); }

const essById = id => db.esencias.find(e => e.id === id);
const curFormula = () => db.formulas.find(f => f.id === ui.editId);
const concLabel = pct => { const c = CONC.find(c => c.pct === pct); return c ? c.label : 'Personalizada'; };

/* ---------- Cálculo ---------- */
function calc(f){
  const gpm = num(f.gpm,20) || 20;
  const vol = Math.max(0, num(f.volumen));
  const concPct = Math.min(100, Math.max(0, num(f.conc)));
  const concMl = vol * concPct / 100;
  const items = f.items.map(it => ({...it, ess:essById(it.essId)})).filter(it => it.ess);
  const totalPartes = items.reduce((s,it) => s + Math.max(0, num(it.partes)), 0);
  const rows = items.map(it => {
    const frac = totalPartes ? Math.max(0,num(it.partes)) / totalPartes : 0;
    const ml = concMl * frac;
    return {...it, frac, ml, gotas: ml * gpm};
  });
  const pir = {salida:0, corazon:0, fondo:0};
  rows.forEach(r => pir[r.ess.nota] += r.frac * 100);
  return {rows, totalPartes, vol, concPct, concMl, alcMl: Math.max(0, vol - concMl), gotasConc: concMl * gpm, gpm, pir};
}
function hints(c){
  if(!c.totalPartes) return [];
  const out = [];
  NOTA_KEYS.forEach(k => {
    const v = c.pir[k], n = NOTAS[k];
    if(v < n.min) out.push(n.low); else if(v > n.max) out.push(n.high);
  });
  return out;
}
function pbar(c, big){
  const p = c.pir;
  return `<div class="pbar${big?' big':''}" role="img" aria-label="Salida ${fmtPct(p.salida)}%, corazón ${fmtPct(p.corazon)}%, fondo ${fmtPct(p.fondo)}%">
    <i class="s" style="width:${p.salida}%"></i><i class="c" style="width:${p.corazon}%"></i><i class="f" style="width:${p.fondo}%"></i></div>`;
}

/* ---------- Render ---------- */
const ICON = `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M9 3h6v3H9z"/><path d="M10 6v2.2a6 6 0 1 0 4 0V6"/><path d="M8.5 15h7"/></svg>`;

function renderTop(){
  const t = $('#topbar');
  if(ui.view === 'editor'){
    const f = curFormula();
    t.innerHTML = `<button class="back" data-act="go" data-to="lista" aria-label="Volver a mis fórmulas">←</button>
      <div class="brand"><span>${esc(f ? f.nombre || 'Sin nombre' : '')}</span></div>`;
  } else {
    t.innerHTML = `<div class="brand">${ICON}<span>Armador de fórmulas</span></div>
      <nav class="tabs" aria-label="Secciones">
        <button data-act="go" data-to="lista" ${ui.view==='lista'?'aria-current="page"':''}>Fórmulas</button>
        <button data-act="go" data-to="esencias" ${ui.view==='esencias'?'aria-current="page"':''}>Esencias</button>
      </nav>`;
  }
}

function render(){
  renderTop();
  const app = $('#app');
  if(ui.view === 'editor' && curFormula()) app.innerHTML = viewEditor(curFormula());
  else if(ui.view === 'esencias') app.innerHTML = viewEsencias();
  else { ui.view = 'lista'; app.innerHTML = viewLista(); renderTop(); }
}

function viewLista(){
  const fs = [...db.formulas].sort((a,b) => b.updated - a.updated);
  const cards = fs.map(f => {
    const c = calc(f);
    return `<button class="fcard" data-act="open" data-id="${f.id}">
      <h3>${esc(f.nombre || 'Sin nombre')}</h3>
      <div class="meta num">${esc(concLabel(c.concPct))} · ${fmtPct(c.concPct)}% · ${fmtInt(c.vol)} ml</div>
      ${pbar(c)}
      <div class="meta">${c.rows.length} esencia${c.rows.length===1?'':'s'} · ${new Date(f.updated).toLocaleDateString('es-AR')}</div>
    </button>`;
  }).join('');
  return `<div class="head"><div><h1>Mis fórmulas</h1><p>Combiná esencias por partes y calculá gotas, ml y alcohol.</p></div>
      <button class="btn primary" data-act="new">+ Nueva fórmula</button></div>
    ${fs.length ? `<div class="flist">${cards}</div>` :
      `<div class="card empty">${ICON}<h2>Todavía no hay fórmulas</h2><p>Creá la primera y empezá a combinar notas.</p>
       <button class="btn primary" data-act="new">+ Nueva fórmula</button></div>`}
    <div class="foot"><span>Se guarda en este navegador.</span>
      <button class="btn small" data-act="export">Exportar copia</button>
      <button class="btn small" data-act="import">Importar copia</button></div>`;
}

function viewEditor(f){
  const c = calc(f);
  const preset = CONC.find(x => x.pct === c.concPct);
  const groups = NOTA_KEYS.map(k => {
    const rs = c.rows.map(r => ({r, i: f.items.findIndex(x => x.essId === r.essId)}))
      .filter(x => x.r.ess.nota === k);
    if(!rs.length) return '';
    return `<div class="group-h"><span class="dot ${k}"></span>${NOTAS[k].label}</div>` + rs.map(({r,i}) => `
      <div class="row">
        <span class="dot ${k}"></span>
        <div class="rn"><b>${esc(r.ess.nombre)}</b><small>${esc(r.ess.familia)}</small></div>
        <div class="stepper">
          <button data-act="dec" data-i="${i}" aria-label="Restar una parte de ${esc(r.ess.nombre)}">−</button>
          <input type="number" inputmode="decimal" min="0" step="1" value="${esc(r.partes)}" data-f="partes" data-i="${i}" aria-label="Partes de ${esc(r.ess.nombre)}">
          <button data-act="inc" data-i="${i}" aria-label="Sumar una parte de ${esc(r.ess.nombre)}">+</button>
        </div>
        <div class="rv num"><b data-o="pct-${i}">${fmtPct(r.frac*100)}%</b><small data-o="ml-${i}">${fmtMl(r.ml)} ml · ${fmtInt(r.gotas)} gotas</small></div>
        <button class="x" data-act="rm" data-i="${i}" aria-label="Quitar ${esc(r.ess.nombre)}">×</button>
      </div>`).join('');
  }).join('');

  return `<div class="layout"><div>
    <div class="card">
      <input class="inp title" data-f="nombre" value="${esc(f.nombre)}" placeholder="Nombre del perfume" aria-label="Nombre del perfume">
      <div class="grid3" style="margin-top:12px">
        <div class="field"><label for="vol">Volumen final</label>
          <div class="inline"><input id="vol" class="inp num" type="number" inputmode="decimal" min="1" value="${esc(f.volumen)}" data-f="volumen"><span class="unit">ml</span></div>
          <div class="chips">${VOLS.map(v => `<button class="chip" data-act="vol" data-v="${v}" aria-pressed="${c.vol===v}">${v}</button>`).join('')}</div>
        </div>
        <div class="field"><label for="conc">Concentración</label>
          <div class="inline"><input id="conc" class="inp num" type="number" inputmode="decimal" min="1" max="100" value="${esc(f.conc)}" data-f="conc"><span class="unit">%</span></div>
          <div class="unit" data-o="conclabel">${esc(preset ? preset.label : 'Personalizada')}</div>
        </div>
        <div class="field"><label for="gpm">Gotas por ml</label>
          <div class="inline"><input id="gpm" class="inp num" type="number" inputmode="decimal" min="1" value="${esc(f.gpm)}" data-f="gpm"><span class="unit">gotas</span></div>
          <div class="unit">Depende del gotero (≈20).</div>
        </div>
      </div>
      <div class="chips" aria-label="Tipos de concentración">${CONC.map(x => `<button class="chip" data-act="conc" data-v="${x.pct}" aria-pressed="${c.concPct===x.pct}">${x.label}<small>${x.pct}%</small></button>`).join('')}</div>
    </div>

    <div class="card">
      <h2>Esencias <small>${c.rows.length ? 'en partes (proporción)' : ''}</small></h2>
      ${c.rows.length ? `<div class="rows">${groups}</div>` : `<p class="unit" style="margin:0 0 4px">Agregá esencias de salida, corazón y fondo para armar la pirámide.</p>`}
      ${ui.picker ? pickerHtml(f) : `<button class="btn" style="margin-top:12px" data-act="picker">+ Agregar esencia</button>`}
    </div>

    <div class="card">
      <div class="field" style="margin:0"><label for="notas">Notas de trabajo</label>
        <textarea id="notas" class="inp" data-f="notas" placeholder="Maceración, ajustes, impresiones…">${esc(f.notas)}</textarea></div>
    </div>
  </div>

  <aside class="side">
    <div class="card" id="results">${resultsHtml(c)}</div>
    <div class="actions">
      <button class="btn" data-act="copy">Copiar receta</button>
      <button class="btn" data-act="print">Imprimir</button>
      <button class="btn" data-act="dup">Duplicar</button>
      <button class="btn danger" data-act="del">Eliminar</button>
    </div>
  </aside></div>`;
}

function resultsHtml(c){
  const h = hints(c);
  return `<h2>Resultado</h2>
    <div class="stats">
      <div class="stat"><div class="k">Concentrado</div><div class="v num">${fmtMl(c.concMl)} <span class="unit">ml</span></div><div class="s2 num">${fmtInt(c.gotasConc)} gotas</div></div>
      <div class="stat"><div class="k">Alcohol</div><div class="v num">${fmtMl(c.alcMl)} <span class="unit">ml</span></div><div class="s2">de perfumería</div></div>
      <div class="stat"><div class="k">Total</div><div class="v num">${fmtInt(c.vol)} <span class="unit">ml</span></div><div class="s2 num">${fmtPct(c.concPct)}% esencias</div></div>
    </div>
    <div style="margin-top:16px"><div class="lbl" style="margin-bottom:8px">Pirámide olfativa</div>${pbar(c, true)}
      <div class="legend num">${NOTA_KEYS.map(k => `<span><i class="dot ${k}"></i>${NOTAS[k].label} ${fmtPct(c.pir[k])}%</span>`).join('')}</div></div>
    ${c.totalPartes ? `<div class="hints">${h.length ? h.map(x => `<div class="hint">${esc(x)}</div>`).join('') :
      `<div class="hint ok"><b>Pirámide equilibrada.</b> Salida 15–30 %, corazón 30–50 %, fondo 25–50 %.</div>`}</div>` : ''}
    <p class="tip">Mezclá primero las esencias de fondo, después corazón y salida; sumá el alcohol al final y dejá macerar 2 a 4 semanas en un lugar oscuro.</p>`;
}

function pickerHtml(f){
  return `<div class="picker">
    <div class="inline"><input class="inp" id="pq" type="search" placeholder="Buscar esencia o familia…" value="${esc(ui.q)}" aria-label="Buscar esencia" autocomplete="off">
      <button class="btn small" data-act="picker-close">Listo</button></div>
    <div class="plist" id="plist">${pickerList(f)}</div></div>`;
}
function pickerList(f){
  const q = ui.q.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  const used = new Set(f.items.map(i => i.essId));
  const html = NOTA_KEYS.map(k => {
    const es = db.esencias.filter(e => e.nota === k && (!q || norm(e.nombre).includes(q) || norm(e.familia).includes(q)))
      .sort((a,b) => a.nombre.localeCompare(b.nombre,'es'));
    if(!es.length) return '';
    return `<div class="group-h"><span class="dot ${k}"></span>${NOTAS[k].label}</div>` + es.map(e =>
      `<button class="pitem${used.has(e.id)?' added':''}" data-act="add" data-id="${e.id}" ${used.has(e.id)?'aria-disabled="true"':''}>
        <b>${esc(e.nombre)}</b><small>${used.has(e.id)?'Agregada':esc(e.familia)}</small></button>`).join('');
  }).join('');
  return html || `<p class="unit" style="padding:8px">No encontré esa esencia. Podés crearla en la pestaña <b>Esencias</b>.</p>`;
}

function viewEsencias(){
  const usedIn = id => db.formulas.filter(f => f.items.some(i => i.essId === id)).length;
  const groups = NOTA_KEYS.map(k => {
    const es = db.esencias.filter(e => e.nota === k).sort((a,b) => a.nombre.localeCompare(b.nombre,'es'));
    return `<div class="card"><h2><span class="dot ${k}" style="margin-right:8px"></span>${NOTAS[k].label} <small>${es.length}</small></h2>
      ${es.map(e => { const u = usedIn(e.id); return `<div class="lib-row"><b>${esc(e.nombre)}</b><small>${esc(e.familia)}${u?` · en ${u} fórmula${u>1?'s':''}`:''}</small>
        <button class="x" data-act="ess-del" data-id="${e.id}" aria-label="Eliminar ${esc(e.nombre)}">×</button></div>`; }).join('') || '<p class="unit">Sin esencias.</p>'}</div>`;
  }).join('');
  return `<div class="head"><div><h1>Esencias</h1><p>Tu biblioteca de materias primas, ordenada por nota.</p></div></div>
    <form class="card addform" id="essForm">
      <div class="field"><label for="en">Nueva esencia</label><input id="en" class="inp" name="nombre" required placeholder="Ej.: Higo" autocomplete="off"></div>
      <div class="field"><label for="enota">Nota</label><select id="enota" class="inp" name="nota">${NOTA_KEYS.map(k => `<option value="${k}">${NOTAS[k].label}</option>`).join('')}</select></div>
      <div class="field"><label for="efam">Familia</label><select id="efam" class="inp" name="familia">${FAMILIAS.map(x => `<option>${x}</option>`).join('')}</select></div>
      <button class="btn primary" type="submit">Agregar</button>
    </form>${groups}`;
}

/* ---------- Actualizaciones parciales (no pierden el foco) ---------- */
function refreshCalc(){
  const f = curFormula(); if(!f) return;
  const c = calc(f);
  c.rows.forEach(r => {
    const i = f.items.findIndex(x => x.essId === r.essId);
    const p = document.querySelector(`[data-o="pct-${i}"]`), m = document.querySelector(`[data-o="ml-${i}"]`);
    if(p) p.textContent = fmtPct(r.frac*100) + '%';
    if(m) m.textContent = `${fmtMl(r.ml)} ml · ${fmtInt(r.gotas)} gotas`;
  });
  $('#results').innerHTML = resultsHtml(c);
  const cl = document.querySelector('[data-o="conclabel"]'); if(cl) cl.textContent = concLabel(c.concPct);
  document.querySelectorAll('[data-act="conc"]').forEach(b => b.setAttribute('aria-pressed', String(num(b.dataset.v) === c.concPct)));
  document.querySelectorAll('[data-act="vol"]').forEach(b => b.setAttribute('aria-pressed', String(num(b.dataset.v) === c.vol)));
}
function touch(f){ f.updated = Date.now(); save(); }

/* ---------- Receta en texto ---------- */
function recipeText(f){
  const c = calc(f);
  const L = [`${f.nombre || 'Sin nombre'} — ${concLabel(c.concPct)} ${fmtPct(c.concPct)}% · ${fmtInt(c.vol)} ml`,
    `Concentrado: ${fmtMl(c.concMl)} ml (${fmtInt(c.gotasConc)} gotas) · Alcohol: ${fmtMl(c.alcMl)} ml`,
    `Pirámide: salida ${fmtPct(c.pir.salida)}% · corazón ${fmtPct(c.pir.corazon)}% · fondo ${fmtPct(c.pir.fondo)}%`, ''];
  NOTA_KEYS.forEach(k => {
    const rs = c.rows.filter(r => r.ess.nota === k); if(!rs.length) return;
    L.push(NOTAS[k].label.toUpperCase());
    rs.forEach(r => L.push(`- ${r.ess.nombre}: ${num(r.partes)} partes · ${fmtPct(r.frac*100)}% · ${fmtMl(r.ml)} ml · ${fmtInt(r.gotas)} gotas`));
    L.push('');
  });
  if(f.notas) L.push('Notas: ' + f.notas);
  return L.join('\n').trim();
}
function printRecipe(f){
  const c = calc(f);
  $('#print').innerHTML = `<h1>${esc(f.nombre || 'Sin nombre')}</h1>
    <div>${esc(concLabel(c.concPct))} ${fmtPct(c.concPct)}% · ${fmtInt(c.vol)} ml · ${fmtInt(c.gpm)} gotas/ml</div>
    <div>Concentrado ${fmtMl(c.concMl)} ml (${fmtInt(c.gotasConc)} gotas) · Alcohol ${fmtMl(c.alcMl)} ml</div>
    <table><thead><tr><th>Nota</th><th>Esencia</th><th class="r">Partes</th><th class="r">%</th><th class="r">ml</th><th class="r">Gotas</th></tr></thead><tbody>
    ${NOTA_KEYS.flatMap(k => c.rows.filter(r => r.ess.nota === k).map(r => `<tr><td>${NOTAS[k].label}</td><td>${esc(r.ess.nombre)}</td>
      <td class="r">${num(r.partes)}</td><td class="r">${fmtPct(r.frac*100)}</td><td class="r">${fmtMl(r.ml)}</td><td class="r">${fmtInt(r.gotas)}</td></tr>`)).join('')}
    </tbody></table>${f.notas ? `<p><b>Notas:</b> ${esc(f.notas)}</p>` : ''}`;
  window.print();
}
async function copyText(t){
  try{ await navigator.clipboard.writeText(t); return true; }
  catch(e){
    const ta = document.createElement('textarea'); ta.value = t; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select(); let ok=false; try{ ok = document.execCommand('copy'); }catch(_){}
    ta.remove(); return ok;
  }
}

/* ---------- Eventos ---------- */
function go(view, id){ ui.view = view; ui.editId = id ?? null; ui.picker = false; ui.q = ''; render(); window.scrollTo(0,0); }

document.addEventListener('click', async ev => {
  const b = ev.target.closest('[data-act]'); if(!b) return;
  const act = b.dataset.act, f = curFormula(), i = num(b.dataset.i, -1);
  switch(act){
    case 'go': go(b.dataset.to); break;
    case 'open': go('editor', b.dataset.id); break;
    case 'new': {
      const nf = {id:uid(), nombre:'Nueva fórmula', volumen:50, conc:18, gpm:20, notas:'', items:[], updated:Date.now()};
      db.formulas.push(nf); save(); ui.picker = true; ui.view='editor'; ui.editId=nf.id; ui.q=''; render(); window.scrollTo(0,0);
      const t = document.querySelector('[data-f="nombre"]'); if(t){ t.focus(); t.select(); }
      break;
    }
    case 'vol': f.volumen = num(b.dataset.v); document.querySelector('#vol').value = f.volumen; touch(f); refreshCalc(); break;
    case 'conc': f.conc = num(b.dataset.v); document.querySelector('#conc').value = f.conc; touch(f); refreshCalc(); break;
    case 'inc': case 'dec': {
      const it = f.items[i]; it.partes = Math.max(0, num(it.partes) + (act==='inc'?1:-1));
      const inp = document.querySelector(`input[data-f="partes"][data-i="${i}"]`); if(inp) inp.value = it.partes;
      touch(f); refreshCalc(); break;
    }
    case 'rm': f.items.splice(i,1); touch(f); render(); break;
    case 'picker': ui.picker = true; render(); $('#pq')?.focus(); break;
    case 'picker-close': ui.picker = false; ui.q=''; render(); break;
    case 'add': {
      if(f.items.some(x => x.essId === b.dataset.id)) return;
      f.items.push({essId:b.dataset.id, partes:1}); touch(f);
      const e = essById(b.dataset.id); render(); $('#pq')?.focus(); toast(`${e.nombre} agregada`); break;
    }
    case 'copy': toast(await copyText(recipeText(f)) ? 'Receta copiada' : 'No se pudo copiar'); break;
    case 'print': printRecipe(f); break;
    case 'dup': {
      const d = JSON.parse(JSON.stringify(f)); d.id = uid(); d.nombre = (f.nombre || 'Sin nombre') + ' (copia)'; d.updated = Date.now();
      db.formulas.push(d); save(); go('editor', d.id); toast('Fórmula duplicada'); break;
    }
    case 'del':
      if(confirm(`¿Eliminar "${f.nombre || 'Sin nombre'}"? No se puede deshacer.`)){ db.formulas = db.formulas.filter(x => x.id !== f.id); save(); go('lista'); toast('Fórmula eliminada'); }
      break;
    case 'ess-del': {
      const e = essById(b.dataset.id);
      const n = db.formulas.filter(x => x.items.some(it => it.essId === e.id)).length;
      if(n){ toast(`${e.nombre} se usa en ${n} fórmula${n>1?'s':''}; quitala primero.`); break; }
      db.esencias = db.esencias.filter(x => x.id !== e.id); save(); render(); toast(`${e.nombre} eliminada`); break;
    }
    case 'export': {
      const blob = new Blob([JSON.stringify(db, null, 2)], {type:'application/json'});
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
      a.download = `formulas-${new Date().toISOString().slice(0,10)}.json`; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
      break;
    }
    case 'import': $('#importFile').click(); break;
  }
});

document.addEventListener('input', ev => {
  const el = ev.target;
  if(el.id === 'pq'){ ui.q = el.value; $('#plist').innerHTML = pickerList(curFormula()); return; }
  const k = el.dataset.f; if(!k) return;
  const f = curFormula(); if(!f) return;
  if(k === 'partes') f.items[num(el.dataset.i)].partes = Math.max(0, num(el.value));
  else if(k === 'nombre'){ f.nombre = el.value; const s = $('#topbar .brand span'); if(s) s.textContent = el.value || 'Sin nombre'; }
  else if(k === 'notas') f.notas = el.value;
  else f[k] = num(el.value);
  touch(f); if(k !== 'nombre' && k !== 'notas') refreshCalc();
});

document.addEventListener('submit', ev => {
  if(ev.target.id !== 'essForm') return;
  ev.preventDefault();
  const fd = new FormData(ev.target), nombre = String(fd.get('nombre')).trim();
  if(!nombre) return;
  if(db.esencias.some(e => e.nombre.toLowerCase() === nombre.toLowerCase())){ toast('Esa esencia ya existe'); return; }
  db.esencias.push({id:uid(), nombre, nota:fd.get('nota'), familia:fd.get('familia')}); save(); render();
  $('#en')?.focus(); toast(`${nombre} agregada a ${NOTAS[fd.get('nota')].label.toLowerCase()}`);
});

$('#importFile').addEventListener('change', async ev => {
  const file = ev.target.files[0]; ev.target.value = ''; if(!file) return;
  try{
    const d = JSON.parse(await file.text());
    if(!d || !Array.isArray(d.esencias) || !Array.isArray(d.formulas)) throw 0;
    if(!confirm(`Importar ${d.formulas.length} fórmulas y ${d.esencias.length} esencias. Esto reemplaza lo actual. ¿Seguir?`)) return;
    db = d; save(); go('lista'); toast('Copia importada');
  }catch(e){ toast('El archivo no es una copia válida'); }
});

render();
</script>
</body>
</html>
