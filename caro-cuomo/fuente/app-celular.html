<script>
/* Si el celular tiene guardada una versión vieja de la app, se recarga sola con la última. */
const APP_VERSION = '__VERSION__';
(async()=>{ try{
  const r = await fetch(location.pathname + '?nc=' + Date.now(), {cache:'no-store', headers:{Range:'bytes=0-1500'}});
  /* lee solo el principio del archivo y corta la descarga */
  const rd = r.body.getReader(); let txt = '';
  while(txt.length < 1500){ const {done, value} = await rd.read(); if(done) break; txt += new TextDecoder().decode(value); }
  rd.cancel().catch(()=>{});
  const m = txt.match(/APP_VERSION = '([^']+)'/);
  if(m && m[1] !== APP_VERSION && !location.search.includes('v=' + m[1])) location.replace(location.pathname + '?v=' + m[1]);
}catch(e){} })();
</script>

<style>
:root{
  --bg:#F7F0E6; --card:#FFFDF9; --ink:#2E2420; --dim:#857467; --line:#E7DBCB; --soft:#F1E7DA;
  --terra:#A4553A; --gold:#B8925A;
  --l-base:#9C5A3C; --l-cor:#C7808F; --l-sal:#E0B860; --l-mag:#7E8FA6;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:16px;line-height:1.4;}
button,input,textarea{font:inherit;color:inherit;}
button{cursor:pointer;border:0;background:none;}

.top{position:sticky;top:0;z-index:10;background:var(--ink);color:#F5ECE0;}
.top-in{max-width:1000px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px;min-height:60px;}
.back{width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.25);font-size:18px;flex:0 0 auto;display:grid;place-items:center;}
.marca{flex:1;min-width:0;display:flex;align-items:center;gap:10px;}
.marca img{height:30px;width:auto;display:block;}
.marca .wm{font-size:11px;letter-spacing:3.5px;text-transform:uppercase;color:#E0CBA8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.prog{display:flex;gap:6px;align-items:center;}
.prog i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.22);display:block;}
.prog i.ok{background:#E0CBA8;} .prog i.on{background:#fff;width:22px;border-radius:5px;}

main{max-width:1000px;margin:0 auto;padding:22px 16px 40px;}
.eb{font-size:12px;letter-spacing:3.5px;text-transform:uppercase;color:var(--terra);font-weight:600;}
h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:40px;line-height:1.05;margin:6px 0;letter-spacing:-.01em;}
h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:28px;line-height:1.1;}
.sub{color:var(--dim);font-size:16px;}
.cab{text-align:center;margin:4px auto 18px;max-width:620px;}
.hint{color:var(--dim);font-size:14px;}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:60px;padding:16px 20px;border-radius:16px;
  background:var(--ink);color:#fff;font-weight:600;letter-spacing:2px;text-transform:uppercase;font-size:15px;margin-top:14px;text-decoration:none;text-align:center;}
.btn.terra{background:var(--terra);}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink);}
.btn:disabled{opacity:.35;cursor:default;}
.sticky-btn{position:sticky;bottom:0;padding:10px 0 14px;background:linear-gradient(to top,var(--bg) 70%,transparent);margin-top:6px;}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px;}

/* registro */
.hero{text-align:center;padding:14px 0 6px;}
.hero h1{font-size:46px;}
.form{max-width:520px;margin:0 auto;}
.fld{margin-top:16px;}
.fld>label{display:block;font-size:14px;font-weight:600;margin-bottom:6px;}
.fld>label small{font-weight:400;color:var(--dim);}
.fld input[type=text],.fld input[type=tel],.fld input:not([type]),.fld select{width:100%;padding:15px 16px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);font-size:17px;}
.perfs{display:flex;flex-direction:column;gap:8px;}
.ac{position:relative;}
.ac input{padding:12px 14px !important;font-size:16px !important;}
.acl{display:none;position:absolute;left:0;right:0;top:100%;z-index:8;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.12);overflow:hidden;margin-top:2px;}
.acl button{display:block;width:100%;text-align:left;padding:12px 14px;font-size:15px;border-bottom:1px solid #f0e9e0;}
.acl span{color:var(--dim);font-size:13px;}
.tel{display:flex;align-items:stretch;border:1.5px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden;}
.tel span{display:flex;align-items:center;padding:0 4px 0 16px;font-size:17px;color:var(--dim);white-space:nowrap;}
.fld .tel input{border:0;border-radius:0;background:transparent;padding-left:6px;min-width:0;}
.check{display:flex;gap:12px;align-items:flex-start;margin-top:18px;font-size:14px;line-height:1.4;cursor:pointer;}
.check input{width:24px;height:24px;flex:0 0 auto;accent-color:var(--terra);margin-top:1px;}

/* cata */
.votos{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
@media (max-width:640px){.votos{grid-template-columns:1fr;}}
.vc{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:12px;}
.vc.hecho{border-color:#d9c8b2;}
.vc .hd{display:flex;align-items:center;gap:12px;}
.vc img{width:84px;height:84px;object-fit:contain;flex:0 0 auto;}
.vc .n{font-family:"Cormorant Garamond",Georgia,serif;font-size:26px;font-weight:600;line-height:1.05;}
.vc .d{color:var(--dim);font-size:13.5px;margin-top:2px;}
.vb{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px;}
.vb button{border:1.5px solid var(--line);border-radius:12px;padding:8px 2px;background:#fbf8f4;font-size:11.5px;line-height:1.15;min-height:58px;}
.vb button b{display:block;font-size:20px;line-height:1.1;margin-bottom:2px;}
.vb button.sel{background:var(--terra);border-color:var(--terra);color:#fff;}
.vb button.sel.v0{background:#6b5d52;border-color:#6b5d52;}

/* análisis */
.analiza{text-align:center;padding:80px 10px;}
.analiza .gota{width:56px;height:56px;margin:0 auto 18px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--terra);animation:lat 1s ease-in-out infinite;}
@keyframes lat{50%{transform:rotate(-45deg) scale(.8);opacity:.6;}}
@media (prefers-reduced-motion:reduce){.analiza .gota{animation:none;}}

/* receta */
.receta{display:grid;grid-template-columns:240px 1fr;gap:22px;align-items:start;}
@media (max-width:720px){.receta{grid-template-columns:1fr;gap:6px;}}
.probeta{width:100%;max-width:240px;margin:0 auto;display:block;}
@media (max-width:720px){.probeta{max-width:190px;}}
.probeta .lay{transform-box:fill-box;transform-origin:50% 100%;animation:llenar .6s cubic-bezier(.3,.7,.3,1) both;}
@keyframes llenar{from{transform:scaleY(0);}}
@media (prefers-reduced-motion:reduce){.probeta .lay{animation:none;}}
.tend{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px;}
.tend span{font-size:13px;padding:5px 11px;border-radius:999px;background:var(--soft);}
.pasos{list-style:none;display:flex;flex-direction:column;gap:8px;}
.pasos li{display:flex;align-items:center;gap:12px;background:var(--card);border:1.5px solid var(--line);border-left:6px solid var(--c);border-radius:16px;padding:10px 14px 10px 10px;}
.pasos img{width:52px;height:52px;object-fit:contain;flex:0 0 auto;}
.pasos .t{flex:1;min-width:0;}
.pasos .t b{display:block;font-family:"Cormorant Garamond",Georgia,serif;font-size:23px;font-weight:600;line-height:1.05;}
.pasos .t small{color:var(--dim);font-size:12.5px;}
.pasos .ml{text-align:right;white-space:nowrap;}
.pasos .ml b{display:block;font-size:19px;}
.pasos .ml small{display:block;font-size:12.5px;color:var(--dim);}
.pasos li.nota{flex-wrap:wrap;}
.tic{flex:1 0 100%;display:flex;flex-wrap:wrap;gap:6px;padding:4px 0 2px 64px;}
.tic button{width:30px;height:30px;border-radius:50%;border:2px solid var(--c);background:transparent;font-size:13px;font-weight:700;color:var(--c);}
.tic button.ok{background:var(--c);color:#fff;}
.pasos li.listo{opacity:.55;}
.pasos li.grande{padding:12px 16px 12px 12px;}
.pasos li.grande img{width:64px;height:64px;}
.pasos li.grande .t b{font-size:26px;}
.pasos li.grande .ml b{font-size:30px;font-weight:700;}
.total{display:flex;align-items:baseline;justify-content:center;gap:10px;margin-top:16px;padding:14px;border-top:1.5px solid var(--line);}
.total span{font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);font-weight:600;}
.total b{font-family:"Cormorant Garamond",Georgia,serif;font-size:34px;}
.total small{color:var(--dim);font-size:14px;}

.bartender .bt-cab small{color:#C9A45C;font-size:15px;letter-spacing:1px;}
.bartender h2{font-family:"Cormorant Garamond",Georgia,serif;font-size:34px;color:#F4EBDD;}

.bartender .bt-l b{font-size:40px;color:#C9A45C;}
.bartender p{color:#B9A98F;text-align:center;font-size:15px;}
.bartender .btn{margin-top:auto;}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}
.grp{font-size:11px;letter-spacing:2.5px;text-transform:uppercase;font-weight:700;color:var(--dim);margin:12px 0 2px;}
.grp:first-child{margin-top:0;}
.cambiar{margin-top:16px;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;}
.cambiar .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.chip{padding:9px 14px;border-radius:999px;border:1.5px solid var(--line);font-size:14px;font-weight:600;background:var(--bg);}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink);}
.chip small{font-weight:500;opacity:.75;}

/* recetas de la casa */
.recs{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
@media (max-width:640px){.recs{grid-template-columns:1fr;}}
.rc{display:flex;align-items:center;gap:12px;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:12px 16px 12px 10px;min-height:92px;}
.rc img{width:72px;height:72px;object-fit:contain;flex:0 0 auto;}
.rc .n{font-family:"Cormorant Garamond",Georgia,serif;font-size:25px;font-weight:600;line-height:1.05;}
.rc .n small{display:block;font-family:Inter,sans-serif;font-size:13px;font-weight:500;color:var(--terra);font-style:italic;margin-top:2px;}
.rc .d{color:var(--dim);font-size:13.5px;margin-top:4px;}
.rc .ok{margin-left:auto;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--terra);white-space:nowrap;}

/* final */
.final{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start;}
@media (max-width:720px){.final{grid-template-columns:1fr;}}
canvas{width:100%;height:auto;border-radius:18px;display:block;box-shadow:0 10px 30px rgba(46,36,32,.18);}

.foot{text-align:center;color:var(--dim);font-size:12px;letter-spacing:2px;text-transform:uppercase;padding:24px 0 30px;}
.foot button{color:var(--dim);margin-left:8px;font-size:15px;letter-spacing:0;}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:30;padding:16px;}
.modal .in{background:#fff;border-radius:20px;padding:22px;width:min(100%,460px);max-height:90vh;overflow:auto;}
.modal select{width:100%;padding:14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-size:16px;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;font-size:15px;z-index:40;max-width:calc(100% - 32px);text-align:center;}
</style>

const FRAX = FRA.map(([n,b,v])=>({n,b,v,k:nz(n+' '+b),kn:nz(n)}));
function buscar(q){ q = nz(q); if(q.length<2) return []; const ws = q.split(' ');
  return FRAX.filter(f=>ws.every(w=>f.k.includes(w))).sort((a,b)=>(b.kn.startsWith(q)-a.kn.startsWith(q)) || a.n.length-b.n.length).slice(0,6); }
function encontrar(t){ const q = nz(t); if(!q) return null;
  return FRAX.find(f=>f.k===q) || FRAX.find(f=>f.kn===q) || FRAX.find(f=>q.startsWith(f.kn) && f.kn.length>3) || null; }
/* perfil 0..1 por familia, promedio de los perfumes reconocidos */
function perfil(p){
  const P = {}; FK.forEach(f=>P[f]=0); let n = 0;
  p.perf.forEach(t=>{ const f = encontrar(t); if(!f) return; n++; FK.forEach((k,i)=>P[k] += (+f.v[i])/9); });
  if(n) FK.forEach(k=>P[k] /= n);
  return {P, n};
}
const afin = (fm, P) => Object.entries(fm).reduce((a,[k,w])=>a + w*(P[k]||0), 0);
const tops = P => Object.entries(P).filter(([,v])=>v>.08).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([k])=>FAMN[k]);

/* ======================= MOTOR QUÍMICO · Caro Cuomo (brief 21/11/2026) =======================
   Base 10 ml + notas 8 ml, ml enteros. Votos: me encanta 3 · me gusta 2 · un poquito 1 (solo como soporte, 1 ml) · no me gusta 0 (nunca).
   Sin votar cuenta como "un poquito". Reparto: protagonista 3 ml · segunda 2 ml · soportes 1 ml; el sobrante va al soporte
   universal de su grupo (Bergamota / Peonía). 3 a 5 notas, al menos 1 de salida y 1 de corazón. Topes por base y soportes obligatorios. */
const voto = (p,id) => p.v[id]==null ? 1 : p.v[id];
const NOTAS_TODAS = () => SALIDA.concat(CORAZON);
const grupo = id => CORAZON.some(c=>c.id===id) ? 'cor' : 'sal';
const UNIVERSAL = {sal:'bergamota', cor:'peonia'};
const ALTERNATIVO = {sal:'pera', cor:'peonia'};
const usaRef = (p, b) => (p.perf||[]).some(t=>{ const q = nz(t); return (b.ref||[]).some(r=>q===r || q.startsWith(r+' ')); });
/* base recomendada: votos de las bases + perfumes que usa + desempate por la nota que más le encanta */
const DESEMPATE = {bruma:['musky','sandalo'], peonia:['musky','gourmand'], rosas:['gourmand','tabaco'], grosella:['gourmand','musky'],
  pera:['gourmand','musky'], higo:['sandalo'], aromatico:['sandalo','tabaco'], bergamota:['tabaco']};
function puntajeBase(p, b){ const {P} = perfil(p); return 4*voto(p,b.id) + 1.5*afin(b.fm,P) + (usaRef(p,b)?4:0); }
function baseSugerida(p){
  const enc = NOTAS_TODAS().filter(n=>voto(p,n.id)===3).map(n=>n.id);
  const c = BASES.map(b=>({b, s:puntajeBase(p,b)}));
  c.forEach(x=>{ x.d = x.s + enc.reduce((a,id)=>a + ((DESEMPATE[id]||[]).includes(x.b.id) ? .9 : 0), 0); });
  if(enc.includes('bruma')) c.forEach(x=>{ if(['gourmand','tabaco'].includes(x.b.id)) x.d -= 1; });
  return c.sort((x,y)=>y.d-x.d)[0].b.id;
}
/* perfil → cuántos ml de salida y de corazón (punto 5.6) */
const PERF_ML = {floral:{sal:3, cor:5}, citrico:{sal:5, cor:3}, amaderado:{sal:4, cor:4}, neutro:{sal:4, cor:4}};
function perfilNotas(p, base){
  const {P} = perfil(p), w = id => voto(p,id), pts = id => w(id)===3 ? 2 : w(id)===2 ? 1 : 0;
  const sc = {
    floral:    pts('peonia') + pts('rosas') + 3*P.floral,
    citrico:   pts('bergamota') + pts('grosella') + pts('pera') + 3*(P.citrica+P.frutal),
    amaderado: (['sandalo','tabaco'].includes(base)?2:0) + pts('higo') + pts('aromatico') + 3*(P.amaderada+P.especiada+P.cuero)
  };
  const ord = Object.entries(sc).sort((a,b)=>b[1]-a[1]);
  return (ord[0][1] >= 2 && ord[0][1] >= ord[1][1]*1.25) ? ord[0][0] : 'neutro';
}
function armar(p, base){
  const B = X[base], w = id => voto(p,id), tope = id => B.tope[id], pf = perfilNotas(p, base), meta = PERF_ML[pf];
  const fuerza = id => tope(id) + (pf==='amaderado' && ['higo','aromatico'].includes(id) ? 1 : 0);
  const rank = (a,b) => w(b)-w(a) || fuerza(b)-fuerza(a) || porMesa(a,b);
  const esUniv = id => id===UNIVERSAL.sal || id===UNIVERSAL.cor;
  const o = {}, lim = {}, suma = () => Object.values(o).reduce((a,b)=>a+b,0), en = g => Object.keys(o).filter(id=>grupo(id)===g);
  /* máximo de cada nota: su tope; "un poquito" solo 1 ml (salvo Bergamota/Peonía cuando hacen de soporte) */
  const maxNota = id => Math.min(lim[id]!=null ? lim[id] : 99, (w(id)===1 && !esUniv(id)) ? 1 : tope(id));
  const puede = id => w(id) >= 1 && maxNota(id) >= 1;
  const todas = () => NOTAS_TODAS().map(n=>n.id);
  /* 1) notas: las que le encantan y le gustan (4, o 5 si le encantan muchas) */
  const buenas = todas().filter(id=>w(id)>=2 && puede(id)).sort(rank);
  const N = buenas.filter(id=>w(id)===3).length >= 4 ? 5 : 4;
  let ids = buenas.slice(0, N);
  const redondeo = g => [B.redondeo[g], ALTERNATIVO[g]].concat(todas().filter(id=>grupo(id)===g).sort(rank)).find(id=>!(id in o) && !ids.includes(id) && puede(id));
  ['sal','cor'].forEach(g=>{ if(!ids.some(id=>grupo(id)===g)){ const r = redondeo(g); if(r){
    if(ids.length >= 4){ const k = ids.slice().reverse().find(id=>ids.filter(x=>grupo(x)===grupo(id)).length > 1); if(k) ids = ids.filter(id=>id!==k); }
    ids.push(r); } } });
  /* 2) protagonista 3 · segunda 2 · soportes 1 */
  ids.sort(rank).forEach((id,i)=>{ o[id] = Math.min(i===0 ? 3 : i===1 ? 2 : 1, maxNota(id)); });
  /* 3) completar hasta 8 ml: cada grupo hacia su meta del perfil; el sobrante va primero al soporte universal */
  const sumar = g => {
    const cands = [UNIVERSAL[g]].concat(en(g).sort(rank)).filter((id,i,a)=>a.indexOf(id)===i);
    for(const id of cands){ if(!puede(id)) continue; if(!(id in o) && Object.keys(o).length >= 5) continue;
      if((o[id]||0) < maxNota(id)){ o[id] = (o[id]||0) + 1; return true; } }
    if(Object.keys(o).length < 5){ const n = redondeo(g); if(n){ o[n] = 1; return true; } }
    return false; };
  const llenar = () => { for(let i=0; suma() < EVENTO.NOTAS_ML && i<40; i++){
    const tot = g => en(g).reduce((a,id)=>a+o[id],0);
    const g = !en('sal').length ? 'sal' : !en('cor').length ? 'cor' : (meta.sal - tot('sal')) >= (meta.cor - tot('cor')) ? 'sal' : 'cor';
    if(!sumar(g) && !sumar(g==='sal'?'cor':'sal')) break; } };
  llenar();
  /* 4) soportes obligatorios (5.5): se repite hasta que todas se cumplan */
  const prot = new Set();   /* soportes ya asegurados: no se les saca ml */
  const asegurar = (id, min) => {
    if(!puede(id) || maxNota(id) < min) return false;
    if(!(id in o) && Object.keys(o).length >= 5){
      const sop = Object.keys(o).filter(x=>o[x]===1 && en(grupo(x)).length > 1).sort((a,b)=>w(a)-w(b))[0]; if(!sop) return false; delete o[sop]; }
    o[id] = o[id] || 0;
    while(o[id] < min){ o[id]++;
      while(suma() > EVENTO.NOTAS_ML){
        const k = Object.keys(o).filter(x=>x!==id && !prot.has(x) && o[x] > 1).sort((a,b)=>o[b]-o[a] || w(a)-w(b))[0]
               || Object.keys(o).filter(x=>x!==id && !prot.has(x) && en(grupo(x)).length > 1).sort((a,b)=>w(a)-w(b))[0];
        if(!k){ o[id]--; if(!o[id]) delete o[id]; return false; }
        o[k]--; if(!o[k]) delete o[k]; } }
    prot.add(id); return true; };
  const limitar = (id, ml) => { lim[id] = ml; if(!ml) delete o[id]; else if(o[id] > ml) o[id] = ml; llenar(); };
  for(let vuelta=0; vuelta<4; vuelta++){
    let cambio = false;
    if(o.bruma){ if((o.bergamota||0)>=2) prot.add('bergamota'); else if((o.aromatico||0)>=2) prot.add('aromatico'); if(base==='gourmand' && (o.peonia||0)>=2) prot.add('peonia'); }
    if(base==='gourmand' && (o.grosella===2 || o.aromatico) && (o.bergamota||0)>=2) prot.add('bergamota');
    if(base==='tabaco' && o.pera && (o.bergamota||0)>=2) prot.add('bergamota');
    if(o.bruma && !((o.bergamota||0)>=2 || (o.aromatico||0)>=2) && !asegurar('bergamota',2) && !asegurar('aromatico',2)){ limitar('bruma',0); cambio = true; }
    if(o.bruma && base==='gourmand' && (o.peonia||0)<2 && !asegurar('peonia',2)){ limitar('bruma',0); cambio = true; }
    if(base==='gourmand' && o.grosella===2 && (o.bergamota||0)<2 && !asegurar('bergamota',2)){ limitar('grosella',1); cambio = true; }
    if(base==='gourmand' && o.aromatico && (o.bergamota||0)<2 && !asegurar('bergamota',2)){ limitar('aromatico',0); cambio = true; }
    if(base==='tabaco' && o.pera && (o.bergamota||0)<2 && !asegurar('bergamota',2)){ limitar('pera',0); cambio = true; }
    llenar();
    if(!cambio) break;
  }
  /* 5) receta modelo: si coincide, se usa su nombre */
  const modelo = MODELOS.find(m=>m.b===base && Object.keys(m.notas).length===Object.keys(o).length && Object.entries(m.notas).every(([id,ml])=>o[id]===ml));
  return {base, baseMl:B.ml + Math.max(0, EVENTO.NOTAS_ML - suma()), notas:o, magia:{}, perfil:pf, receta: modelo ? modelo.n : null, falta:0};
}
/* se carga con jeringa de 1 ml: "4 jeringas" */
const dosis = ml => ml===1 ? '1 jeringa' : ml+' jeringas';
const r2 = n => Math.round(n*100)/100;
function nombreSugerido(r, quien){
  let n = r.receta;
  if(!n){ /* la receta modelo más parecida de su base, si comparte protagonista y otra nota */
    const prot = Object.entries(r.notas).sort((a,b)=>b[1]-a[1])[0][0];
    const m = MODELOS.filter(m=>m.b===r.base && m.notas[prot]).map(m=>({m, k:Object.keys(m.notas).filter(id=>r.notas[id]).length})).sort((a,b)=>b.k-a.k)[0];
    if(m && m.k >= 2) n = m.m.n;
    else { const tipo = r.perfil==='floral' ? 'floral' : r.perfil==='citrico' ? 'fresco' : r.base==='sandalo' ? 'amaderado' : ['tabaco','gourmand'].includes(r.base) ? 'intenso' : 'fresco';
      const l = NOMBRES[tipo]; n = l[Math.floor(Math.random()*l.length)]; }

}
function recetaTxt(r){ if(!r) return '';
  const l = [`Base ${X[r.base].n} ${r.baseMl} ml`].concat(Object.entries(r.notas).map(([id,ml])=>`${X[id].n} ${fmt(ml)} ml`));

/* ORDEN DE LA MESA: el invitado camina de izquierda a derecha; el perfumista, del otro lado, de derecha a izquierda.
   Los dos encuentran las cosas en este orden: primero las 4 ampollas de bases y después los goteros de notas. */
const ORDEN_MESA = ['gourmand','musky','tabaco','sandalo','bergamota','grosella','pera','bruma','peonia','rosas','higo','aromatico'];   /* Bar Butler 1 y 2 */
const estacion = id => ORDEN_MESA.indexOf(id) + 1;

/* PLANILLA: para cada aroma, en el orden de la mesa, una columna con el voto y otra con los ml que lleva su perfume */

}

function chk(){ const b = $('#go'); if(b) b.disabled = !(listo()); }
function tipear(i, val){ P.perf[i] = val; guardar(); const l = $('#acl'+i), r = buscar(val);
  l.innerHTML = r.map(f=>`<button type="button" onmousedown="event.preventDefault()" onclick="elegirPerf(${i},this.dataset.v)" data-v="${esc(f.n+' · '+f.b)}"><b>${esc(f.n)}</b> <span>${esc(f.b)}</span></button>`).join('');
  l.style.display = r.length ? 'block' : 'none'; }
function elegirPerf(i, v){ P.perf[i] = v; guardar(); const inp = $('#pf'+i); if(inp) inp.value = v; cerrarAc(i); const nx = $('#pf'+(i+1)); if(nx && !nx.value) nx.focus(); }

  return `<div class="vc ${v!=null?'hecho':''}"><div class="hd"><img src="${foto(img||a.img||a.id)}" alt=""><div><div class="n">${esc(a.n)}</div><div class="d">${esc(a.frase||a.d)}</div></div></div>
    <div class="vb" role="group" aria-label="¿Qué te pareció ${esc(a.n)}?">${VOTOS.map(([k,s,t])=>`<button class="${v===k?'sel v'+k:''}" aria-pressed="${v===k}" onclick="votar('${a.id}',${k})"><b>${s}</b>${t}</button>`).join('')}</div></div>`;
}
function vCata(tit, eb, sub, lista, sig, txtSig){
  const faltan = lista.filter(a=>P.v[a.id]==null).length;
  return `<div class="cab"><div class="eb">${eb}</div><h1>${tit}</h1><p class="sub">${sub}</p></div>
    <div class="votos">${lista.map(a=>tarjetaVoto(a)).join('')}</div>

}

const vSalida  = () => vCata('Notas de salida','Paso 3 · Salida','Lo primero que se siente al ponértelo.', SALIDA, 'nombre', 'Seguir');
function votar(id, k){ P.v[id] = k; guardar(); const y = window.scrollY; pintar(); window.scrollTo(0,y); }
function seguir(sig, faltan){
  if(faltan && !confirm('Te faltan votar algunas. Las que no votes cuentan como "un poquito". ¿Seguimos?')) return;
  if(sig==='analisis'){ analizar(); return; }
  ir(sig);

}

/* 5 · receta: lista simple, foto y cantidad bien grande */
function vReceta(){
  const r = P.r, B = X[r.base];
  const fila = (img, nom, sub, cant, unidad, col) => `<li class="grande" style="--c:${col}"><img src="${foto(img)}" alt=""><div class="t"><b>${esc(nom)}</b><small>${sub}</small></div><div class="ml"><b>${cant}</b><small>${unidad}</small></div></li>`;
  const notas = (g, tit, col) => { const l = Object.entries(r.notas).filter(([id])=>grupo(id)===g).sort((a,b)=>b[1]-a[1] || porMesa(a[0],b[0]));
    return l.length ? `<div class="grp">${tit}</div>` + l.map(([id,ml])=>fila(id, X[id].n, dosis(ml), fmt(ml)+' ml', '', col)).join('') : ''; };
  return `<div class="cab"><div class="eb">Paso 5 · Tu receta</div><h1>${esc(P.pn.trim())}</h1>
      <p class="sub">Base ${esc(B.n)}${r.base===P.sug?', la que mejor va con vos':''}. Cargá en este orden: base, corazón y al final la salida.</p>
      <div class="tend">${BASES.map(b=>`<button class="chip" aria-pressed="${r.base===b.id}" onclick="cambiarBase('${b.id}')">${esc(b.n)}${b.id===P.sug?' ★':''}</button>`).join('')}</div></div>
    <div class="form" style="max-width:620px"><ol class="pasos">
      <div class="grp">1 · Base · con jeringa</div>
      ${fila(B.img, 'Base '+B.n, dosis(r.baseMl), r.baseMl+' ml', '', 'var(--l-base)')}
      ${notas('cor','2 · Corazón · con jeringa','var(--l-cor)')}
      ${notas('sal','3 · Salida · con jeringa','var(--l-sal)')}
    </ol>
    <div class="total"><span>Total</span><b>${EVENTO.ML} ml</b><small>Volcalo en tu frasco</small></div>
    <button class="btn ghost" onclick="modoBartender()">Pedírselo al perfumista</button>
    <p class="hint" style="text-align:center;margin-top:6px">Muestra tu receta en grande para que el perfumista te la cargue.</p>
    <button class="btn terra" onclick="terminar()">Listo · ver mi perfume</button></div>${pie()}`;
}

/* modo perfumista: la receta en grande, para mostrarle el celular al perfumista que la carga */
function modoBartender(){
  const r = P.r, B = X[r.base];

  const orden = g => Object.entries(r.notas).filter(([id])=>grupo(id)===g).sort((a,b)=>b[1]-a[1] || porMesa(a[0],b[0]));

/* Botón de WhatsApp: guarda la imagen en el celular y abre el chat con Emotional Reminder con un mensaje
   ya escrito (nombre, perfume, receta y código). El invitado solo toca enviar: así llega su número real,
   y el código permite cruzar el chat con su fila de la planilla. */
let blobFinal = null;
function prepararBlob(){ const cv = $('#cv'); if(cv) cv.toBlob(b=>{ blobFinal = b; }, 'image/png'); }
function blobYa(){ /* sin esperas, para no perder el permiso del toque en iPhone */
  if(blobFinal) return blobFinal;
  const u = $('#cv').toDataURL('image/png'), bin = atob(u.split(',')[1]), a = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) a[i] = bin.charCodeAt(i); return new Blob([a], {type:'image/png'}); }
const codigo = p => p.cod || (p.cod = ('CC-' + Math.random().toString(36).slice(2,6)).toUpperCase());
/* mensaje de WhatsApp ordenado: una línea "Dato: valor" por renglón, para leerlo a simple vista
   y para que una tarea automática lo cargue como cliente (la llave es el Código) */
function textoWA(){
  const r = P.r, B = X[r.base];
  const notas = g => Object.entries(r.notas).filter(([id])=>grupo(id)===g).sort((a,b)=>b[1]-a[1]).map(([id,ml])=>`${X[id].n} ${fmt(ml)} ml`).join(' · ') || '—';
  const enc = BASES.concat(NOTAS_TODAS()).filter(a=>P.v[a.id]===3).map(a=>(BASES.includes(a)?'Base ':'')+a.n).join(', ') || '—';
  const perf = (P.perf||[]).filter(x=>x&&x.trim()).map(x=>x.split(' · ')[0]).join(', ') || '—';
  return [
    '✨ *Mi perfume · Emotional Reminder*',
    '',
    `Evento: ${EVENTO.nombre}`,
    `Código: ${codigo(P)}`,
    `Nombre: ${P.nom.trim()}`,
    `Perfume: ${P.pn.trim()}`,
    '',
    `Base: ${B.n} · ${fmt(r.baseMl)} ml`,
    `Corazón: ${notas('cor')}`,
    `Salida: ${notas('sal')}`,
    `Total: ${fmt(EVENTO.ML)} ml`,
    '',
    `Le encantó: ${enc}`,
    `Perfumes que usa: ${perf}`,
    '',
    '#PerfumeBar'
  ].join('\n');
}
async function mandarWA(){
  const url = `https://wa.me/${EVENTO.WA_ER}?text=${encodeURIComponent(textoWA())}`;
  const blob = blobYa(), nom = 'perfume_' + nz(P.pn||P.nom).replace(/ /g,'_') + '.png';
  const file = new File([blob], nom, {type:'image/png'});
  P.waEnviado = true; guardar(); registrar(P,'Terminó');
  let compartida = false;
  try{ if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:P.pn||'Mi perfume'}); compartida = true; } }catch(e){}
  if(!compartida){ try{ const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nom; document.body.appendChild(a); a.click(); a.remove(); }catch(e){} }
  aviso('Imagen guardada · ahora tocá enviar en WhatsApp');
  setTimeout(()=>{ location.href = url; }, 700);
}
function otro(){ if(!confirm('¿Empezar un perfume nuevo? Este ya quedó guardado.')) return; P = nuevo(); guardar(); pintar(); window.scrollTo(0,0); }

/* ======================= IMAGEN FINAL ======================= */
const BGS = {blanco:{bg:'#FFFFFF', ink:'#2B2420', acc:'#A4553A', dim:'#8a7a6e'}, marfil:{bg:'#F7F1E8', ink:'#2B2420', acc:'#A4553A', dim:'#7d6e62'},
  terracota:{bg:'#8E4A33', ink:'#F8EFE6', acc:'#F1C9A4', dim:'#E6CDBB'},
  negro:{bg:'#0E0C0B', ink:'#F4EBDD', acc:'#C9A45C', dim:'#B9A98F', oscuro:true}};   /* negro y dorado, como las bolsas del evento */
const fondoImg = () => LS.get('er_caro_fondo','negro');
const IMC = {};
function imgEl(k){ if(IMC[k]) return IMC[k]; const im = new Image(); im.onload = ()=>{ im._ok = 1; if(typeof alCargarImagen==='function') alCargarImagen(); }; im.src = foto(k); return IMC[k] = im; }
const foto = k => IMGS[k] || '';
const notasDe = (r, et) => Object.entries(r.notas).filter(([id])=>etapa(id)===et).sort((a,b)=>b[1]-a[1]).map(([id])=>id);
function familiaTxt(r){
  const fam = {}; Object.entries(r.notas).forEach(([id,ml])=>Object.entries(X[id].fm).forEach(([f,w])=>fam[f]=(fam[f]||0)+ml*w));
  const f = Object.entries(fam).sort((a,b)=>b[1]-a[1])[0];
  return [X[r.base].n].concat(f ? [FAMN[f[0]]] : []).join(' · ');
}
/* imagen final: las notas apiladas, salida arriba, corazón al medio, base abajo.
   Cada dibujo es más grande cuanto más ml lleva y se pisan un poco para que no queden huecos.
   Al costado de cada grupo, la lista de notas: las que eligió + las que ya trae la base (se suman). */
const NMAGIA = {hedione:['c','Jazmín luminoso'], isoe:['f','Maderas aterciopeladas'], galaxolide:['f','Almizcle blanco']};
function piramide(r){
  const b = X[r.base], o = {s:[], c:[], f:[]}, vistos = [];
  const add = (e, t) => { const k = nz(t); if(vistos.some(v=>v===k || v.startsWith(k+' ') || k.startsWith(v+' '))) return; vistos.push(k); o[e].push(t); };
  notasDe(r,'sal').forEach(id=>add('s',X[id].n)); b.S.forEach(t=>add('s',t));
  notasDe(r,'cor').forEach(id=>add('c',X[id].n)); b.C.forEach(t=>add('c',t));
  b.F.forEach(t=>add('f',t));
  Object.keys(r.magia||{}).forEach(id=>{ const m = NMAGIA[id]; if(m) add(m[0], m[1]); });
  return o;
}
const ESP = String.fromCharCode(8202);
/* Layout de la imagen: una columna de dibujos alineada (como Pequeñas perfumistas), salida arriba,
   corazón al medio y la base abajo, más grande cuanto más ml lleva. Los textos van a los costados de
   su grupo si entran prolijos; si no, los tres van abajo en columnas. */
const VAIVEN = [0, -0.30, 0.28, -0.14, 0.18, -0.32, 0.26, -0.12];
const MODO_TEXTO = 'abajo';   /* 'auto' · 'lados' · 'abajo' */
/* dibujos de relleno: notas que ya trae cada base, para dar volumen y que la columna no tenga huecos */
const RELLENO = {
  musky:    {s:['n_lima'],                c:['n_azahar','jazmin'],     f:['n_cedro','n_ambar']},
  sandalo:  {s:['aromatico'],             c:['n_cedro','n_vetiver'],   f:['n_sandalo','n_cuero']},
  tabaco:   {s:['bergamota','n_citrico'], c:['n_oriental','n_sandalo'],f:['n_ambar','n_cuero']},
  gourmand: {s:['n_citrico'],             c:['n_azahar','n_vainilla'], f:['n_ddl','n_ambar']}
};
const MIN_GRUPO = 3;   /* cada etapa se completa hasta 3 dibujos con relleno */
function columna(r){
  const usados = new Set(), out = [], rel = RELLENO[r.base] || {s:[],c:[],f:[]};
  const etapaCol = (e, propias) => {
    const ps = propias.map(id=>({img:id, ml:r.notas[id], e})); ps.forEach(x=>usados.add(x.img));
    const fill = (rel[e]||[]).filter(k=>!usados.has(k) && IMGS[k]);
    const n = Math.max(0, MIN_GRUPO - ps.length), extra = fill.slice(0, n).map(k=>({img:k, ml:1.4, e, relleno:true}));
    extra.forEach(x=>usados.add(x.img));
    /* intercalar: propia, relleno, propia, relleno… */
    const L = []; for(let i=0; i<Math.max(ps.length, extra.length); i++){ if(ps[i]) L.push(ps[i]); if(extra[i]) L.push(extra[i]); }
    return L;
  };
  out.push(...etapaCol('s', notasDe(r,'sal')), ...etapaCol('c', notasDe(r,'cor')));
  const fondo = (rel.f||[]).filter(k=>!usados.has(k) && IMGS[k]).slice(0, out.length < 6 ? 2 : 1).map(k=>({img:k, ml:1.6, e:'f', relleno:true}));
  out.push(...fondo, {img:X[r.base].img, ml:r.baseMl||X[r.base].ml, e:'f'});
  return out;
}
function apilar(r, c, Y0, Y1, dibuja){
  const W = 1080, ns = columna(r), SOL = 0.50, UTIL = Y1-Y0;
  const mx = Math.max.apply(null, ns.map(x=>x.ml));
  /* tamaño de cada dibujo: más grande cuanto más ml; el ancho nunca pasa de 540 px */
  const med = k => ns.map(n=>{ const im = imgEl(n.img), iw = im._ok ? im.width : 1, ih = im._ok ? im.height : 1;
    const a = k*(170 + 300*Math.sqrt(n.ml/mx)), e = Math.min(a/ih, Math.min(600, a*1.9)/iw); return {im, w:iw*e, h:ih*e}; });
  /* el avance usa el alto real de cada dibujo, así se pisan siempre igual y no quedan huecos */
  const alto = ms => ms.reduce((t,m,i)=>t + (i<ms.length-1 ? m.h*(1-SOL) : m.h), 0);
  let k = 1, ms = med(k); const a0 = alto(ms); if(a0 > UTIL){ k = UTIL/a0; ms = med(k); }
  let y = Y0 + Math.max(0, (UTIL - alto(ms))/2); const rects = [], zona = {};
  ns.forEach((n,i)=>{ const {im, w, h} = ms[i];
    const libre = Math.min(90, (W-w)/2 - 150), x = (W-w)/2 + VAIVEN[i % VAIVEN.length]*Math.max(0,libre)*1.6;
    if(dibuja && im._ok) c.drawImage(im, x, y, w, h);
    const q = {x0:x+w*.03, x1:x+w*.97, y0:y+h*.03, y1:y+h*.97}; rects.push(q);
    const z = zona[n.e] || (zona[n.e] = {y0:1e9, y1:0}); z.y0 = Math.min(z.y0, q.y0); z.y1 = Math.max(z.y1, q.y1);
    y += h*(1-SOL); });
  return {rects, zona};
}
function dibujar(p, c){
  const W = 1080, H = 1528, T = BGS[fondoImg()] || BGS.blanco, SERIF = '"Cormorant Garamond", Georgia, serif', r = p.r;
  c.fillStyle = T.bg; c.fillRect(0,0,W,H);
  if(fondoImg()==='terracota'){ const g = c.createRadialGradient(W/2,760,80,W/2,760,900); g.addColorStop(0,'rgba(255,220,190,.22)'); g.addColorStop(1,'rgba(0,0,0,.28)'); c.fillStyle = g; c.fillRect(0,0,W,H); }
  /* encabezado */
  c.textAlign = 'center'; c.textBaseline = 'alphabetic';
  /* monograma de la boda arriba */
  let top = 0;
  if(EVENTO.LOGO_EVENTO){ const lg = imgEl(['terracota','negro'].includes(fondoImg()) ? EVENTO.LOGO_EVENTO+'_claro' : EVENTO.LOGO_EVENTO);
    if(lg._ok){ const h = 190, w = lg.width*h/lg.height; c.drawImage(lg, W/2-w/2, 36, w, h); } top = 186; }
  c.fillStyle = T.ink; let fs = 92; c.font = `600 ${fs}px ${SERIF}`; const tit = p.pn.trim() || 'Mi perfume';
  while(c.measureText(tit).width > W-120 && fs > 56){ fs -= 4; c.font = `600 ${fs}px ${SERIF}`; }
  c.fillText(tit, W/2, 138+top);
  c.fillStyle = T.acc; c.font = '600 23px Inter, sans-serif'; c.fillText(familiaTxt(r).toUpperCase().split('').join(ESP), W/2, 186+top);
  c.fillStyle = T.dim; c.font = `italic 500 36px ${SERIF}`; c.fillText('Creado por ' + p.nom.trim(), W/2, 234+top);
  c.strokeStyle = T.acc; c.lineWidth = 2; c.beginPath(); c.moveTo(W/2-60,262+top); c.lineTo(W/2+60,262+top); c.stroke();
  /* firma al pie */
  let pie = 50;
  if(EVENTO.FIRMA && EVENTO.FIRMA.length){
    c.fillStyle = T.acc; c.font = '600 17px Inter, sans-serif'; c.fillText(EVENTO.FIRMA[0].toUpperCase().split('').join(ESP+ESP), W/2, H-74);
    if(EVENTO.FIRMA[1]){ c.fillStyle = T.dim; c.font = `italic 500 25px ${SERIF}`; c.fillText(EVENTO.FIRMA[1], W/2, H-42); }
    pie = 120; }
  const Y0 = 290 + top;

  const pr = piramide(r), TIT = {s:'Notas de salida', c:'Notas de corazón', f:'Notas de fondo'}, M = 56, TMIN = 28;
  const bloque = (e, tam) => { c.font = `500 ${tam}px ${SERIF}`; const lh = tam*1.15;
    return {tam, lh, alto: 46 + pr[e].length*lh, ancho: Math.max.apply(null, pr[e].map(t=>c.measureText(t).width).concat([c.measureText('x').width]))}; };
  const pinta = (e, xt, y0, m, align) => {
    c.textAlign = align; c.textBaseline = 'alphabetic';
    c.fillStyle = T.acc; c.font = '600 20px Inter, sans-serif'; c.fillText(TIT[e].toUpperCase().split('').join(ESP), xt, y0+20);
    const lx = align==='left' ? [xt, xt+50] : align==='right' ? [xt-50, xt] : [xt-25, xt+25];
    c.strokeStyle = T.acc; c.lineWidth = 1.5; c.beginPath(); c.moveTo(lx[0], y0+34); c.lineTo(lx[1], y0+34); c.stroke();
    c.fillStyle = T.ink; c.font = `500 ${m.tam}px ${SERIF}`;
    pr[e].forEach((t,i)=>c.fillText(t, xt, y0 + 46 + m.lh*(i+1) - m.lh*.25)); };

  /* 1º intento: textos a los costados. Cada bloque busca, en el lado con más lugar junto a su grupo,
     el hueco libre de dibujos más cercano. Si alguno no entra con letra ≥ TMIN, se pasa todo abajo. */
  const planLados = () => {
    const {rects, zona} = apilar(r, c, Y0, H-pie, false), plan = [], ocup = rects.slice();
    for(const e of ['s','c','f']){
      if(!pr[e].length) continue;
      const z = zona[e] || {y0:300, y1:H-50}, centro = (z.y0+z.y1)/2;
      let mejor = null;
      for(const izq of [true, false]){
        /* ancho libre en ese lado a la altura del grupo */
        const enGrupo = rects.filter(q=>q.y1 > z.y0 && q.y0 < z.y1);
        const borde = izq ? Math.min.apply(null, enGrupo.map(q=>q.x0)) : Math.max.apply(null, enGrupo.map(q=>q.x1));
        const TW = izq ? borde - M - 16 : W - M - borde - 16; if(TW < 220) continue;
        const cx0 = izq ? M : W-M-TW, cx1 = cx0+TW;
        const tapan = ocup.filter(q=>q.x1 > cx0 && q.x0 < cx1).sort((a,b)=>a.y0-b.y0);
        const huecos = []; let yy = 300; tapan.forEach(q=>{ if(q.y0 > yy) huecos.push([yy, q.y0]); yy = Math.max(yy, q.y1); }); if(H-50 > yy) huecos.push([yy, H-50]);
        for(const [a,b] of huecos){ let m = bloque(e, 34); while((m.ancho > TW || m.alto > b-a) && m.tam > TMIN) m = bloque(e, m.tam-1);
          if(m.ancho > TW || m.alto > b-a) continue;
          const y0 = Math.max(a, Math.min(b-m.alto, centro-m.alto/2)), dist = Math.abs(y0+m.alto/2-centro);
          if(dist > 260) continue;   /* lejos de su grupo no se entiende */
          const pts = m.tam*12 - dist; if(!mejor || pts > mejor.pts) mejor = {e, izq, y0, m, pts, cx0, cx1}; } }
      if(!mejor) return null;
      plan.push(mejor); ocup.push({x0:mejor.cx0, x1:mejor.cx1, y0:mejor.y0-18, y1:mejor.y0+mejor.m.alto+18});
    }
    /* todos los bloques con la misma letra, para que se vea parejo */
    const t = Math.min.apply(null, plan.map(b=>b.m.tam)); plan.forEach(b=>{ b.m = bloque(b.e, t); });
    return plan;
  };
  const plan = MODO_TEXTO==='abajo' ? null : planLados();
  if(plan || MODO_TEXTO==='lados'){
    apilar(r, c, Y0, H-pie, true);
    (plan||[]).forEach(b=>pinta(b.e, b.izq ? M : W-M, b.y0, b.m, b.izq ? 'left' : 'right'));
  } else {
    /* textos abajo, en tres columnas iguales */
    const es = ['s','c','f'].filter(e=>pr[e].length), cw = (W-2*M)/es.length;
    let tam = 30, ms; do { ms = es.map(e=>bloque(e, tam)); tam--; } while(ms.some(m=>m.ancho > cw-24) && tam > 20);
    const alto = Math.max.apply(null, ms.map(m=>m.alto)), yT = H - pie - alto;
    apilar(r, c, Y0, yT - 30, true);
    c.strokeStyle = T.dim; c.globalAlpha = .3; c.lineWidth = 1;
    es.slice(1).forEach((_,i)=>{ const x = M + cw*(i+1); c.beginPath(); c.moveTo(x, yT); c.lineTo(x, yT+alto); c.stroke(); }); c.globalAlpha = 1;
    es.forEach((e,i)=>pinta(e, M + cw*i + cw/2, yT, ms[i], 'center'));
  }
  c.textAlign = 'center'; c.textBaseline = 'alphabetic';
}
/*@@FIN2*/
function dibujarCv(){ const cv = $('#cv'); if(cv && P.r){ dibujar(P, cv.getContext('2d')); clearTimeout(dibujarCv.t); dibujarCv.t = setTimeout(prepararBlob, 300); } }
async function compartir(){
  const cv = document.createElement('canvas'); cv.width = 1080; cv.height = 1528;
  try{ await document.fonts.ready; }catch(e){}
  dibujar(P, cv.getContext('2d'));
  const blob = await new Promise(r=>cv.toBlob(r,'image/png'));
  const nom = 'perfume_' + nz(P.pn||P.nom).replace(/ /g,'_') + '.png';
  const file = new File([blob], nom, {type:'image/png'});
  try{ if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:P.pn||'Mi perfume'}); return; } }catch(e){ if(e && e.name==='AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nom; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}

/* ======================= PANEL DEL ORGANIZADOR ======================= */
let panelOk = false;
function abrirPanel(){
  const cola = LS.get('er_pb_cola',[]);
  const d = document.createElement('div'); d.className = 'modal'; d.onclick = e=>{ if(e.target===d) d.remove(); };
  d.innerHTML = panelOk ? `<div class="in"><h2>Panel</h2><p class="hint" style="margin:6px 0">Pendientes de enviar a la planilla: <b>${cola.length}</b>${navigator.onLine?'':' · sin conexión'}</p>
    <div class="fld"><label for="purl">URL del script</label><input id="purl" value="${esc(urlScript())}"></div>
    <button class="btn" onclick="LS.set('er_pb_url',document.getElementById('purl').value.trim());vaciar();aviso('Guardado');this.closest('.modal').remove()">Guardar y reenviar</button>
    <div class="fld"><label for="pfondo">Fondo de la imagen final</label><select id="pfondo" onchange="LS.set('er_caro_fondo',this.value);dibujarCv()">
      ${[['blanco','Blanco'],['negro','Negro y dorado'],['marfil','Marfil'],['terracota','Terracota']].map(([v,t])=>`<option value="${v}" ${fondoImg()===v?'selected':''}>${t}</option>`).join('')}</select></div>
    <button class="btn ghost" onclick="this.closest('.modal').remove();P=nuevo();guardar();pintar()">Empezar de cero en este celular</button>
    <button class="btn ghost" onclick="this.closest('.modal').remove()">Cerrar</button></div>`
  : `<div class="in"><h2>Panel</h2><div class="fld"><label for="ppin">PIN</label><input id="ppin" type="password" inputmode="numeric"></div>
    <button class="btn" onclick="if(document.getElementById('ppin').value===EVENTO.PIN){panelOk=true;this.closest('.modal').remove();abrirPanel()}else{aviso('PIN incorrecto')}">Entrar</button>
    <button class="btn ghost" onclick="this.closest('.modal').remove()">Cancelar</button></div>`;
  document.body.appendChild(d); const i = d.querySelector('input'); if(i && !panelOk) i.focus();
}

/* ======================= PINTAR ======================= */
function pintar(){
  if(P.paso!=='registro' && !(listo())) P.paso = 'registro';
  if(['receta','final'].includes(P.paso) && !P.r) P.paso = 'nombre';
  if(P.paso==='recetas') P.paso = 'receta';
  /* receta guardada con el motor anterior: se rehace con las reglas nuevas */
  if(P.r && !P.r.perfil){ P.r = armar(P, P.r.base); guardar(); }
  if(P.paso==='analisis') { setTimeout(()=>{ if(P.paso==='analisis') ir('receta'); }, 1600); }
  barra();
  const V = {registro:vRegistro, bases:vBases, corazon:vCorazon, salida:vSalida, analisis:vAnalisis, nombre:vNombre, receta:vReceta, final:vFinal}[P.paso] || vRegistro;
  $('#app').innerHTML = V();
  if(P.paso==='registro') chk();
  if(P.paso==='final') dibujarCv();
}
/* el canvas usa caras que la página no muestra: cargarlas antes de dibujar */
if(document.fonts){ Promise.all(['600 96px "Cormorant Garamond"','italic 500 42px "Cormorant Garamond"','600 24px Inter','400 24px Inter'].map(f=>document.fonts.load(f).catch(()=>{})))
  .then(()=>{ if(P.paso==='final') dibujarCv(); }); }
pintar(); vaciar();
</script>
