<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Perfume Bar">
<meta name="theme-color" content="#2E2420">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icono.png">
<title>Perfume Bar · Tablet</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F0E6; --card:#FFFDF9; --ink:#2E2420; --dim:#857467; --line:#E7DBCB; --soft:#F1E7DA;
  --terra:#A4553A; --gold:#B8925A;
  --l-base:#9C5A3C; --l-cor:#C7808F; --l-sal:#E0B860; --l-mag:#7E8FA6;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.35;}
button,input{font:inherit;color:inherit;}
button{cursor:pointer;border:0;background:none;}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px;}

.top{position:sticky;top:0;z-index:20;background:var(--ink);color:#F5ECE0;}
.top-in{display:flex;align-items:center;gap:14px;padding:10px 16px;min-height:56px;}
.top .wm{flex:1;font-size:11px;letter-spacing:3.5px;text-transform:uppercase;color:#E0CBA8;}
.top .tab{font-weight:700;letter-spacing:1px;background:rgba(255,255,255,.12);padding:6px 12px;border-radius:999px;font-size:13px;}
.top .pend{font-size:12px;color:#E0CBA8;}
.pasos{display:flex;gap:6px;}
.pasos span{font-size:12px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.1);color:#E0CBA8;}
.pasos span.on{background:#F5ECE0;color:var(--ink);font-weight:700;}

main{padding:14px 16px 120px;}
h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:30px;line-height:1.1;}
.sub{color:var(--dim);font-size:14px;}
.cab{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap;}

/* grilla de cata: filas = aromas, columnas = personas */
.grilla{display:grid;grid-template-columns:minmax(150px,1fr) repeat(4, minmax(170px,1.15fr));gap:0;background:var(--card);border:1.5px solid var(--line);border-radius:16px;overflow:hidden;}
.grilla > div{border-bottom:1px solid var(--line);padding:8px;display:flex;align-items:center;}
.grilla .hd{position:sticky;top:56px;z-index:5;background:var(--card);border-bottom:2px solid var(--ink);padding:10px 8px;}
.grilla .col-a, .grilla .col-c{background:#FCF8F2;}
.persona{width:100%;display:flex;flex-direction:column;gap:4px;}
.persona .letra{font-size:11px;letter-spacing:2px;font-weight:700;color:var(--terra);}
.persona input{width:100%;font-family:"Cormorant Garamond",Georgia,serif;font-size:24px;font-weight:600;border:1.5px solid var(--line);border-radius:10px;padding:6px 10px;background:#fff;}
.persona small{color:var(--dim);font-size:11.5px;}
.grupo-h{grid-column:1 / -1;background:var(--soft) !important;font-size:12px;letter-spacing:3px;text-transform:uppercase;font-weight:700;color:var(--dim);padding:6px 10px !important;}
.aroma{gap:10px;}
.aroma img{width:46px;height:46px;object-fit:contain;flex:0 0 auto;}
.aroma b{font-family:"Cormorant Garamond",Georgia,serif;font-size:21px;font-weight:600;line-height:1.05;}
.votos{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;width:100%;}
.votos button{border:1.5px solid var(--line);border-radius:10px;background:#fff;min-height:44px;font-size:17px;line-height:1;}
.votos button small{display:block;font-size:9.5px;margin-top:2px;color:var(--dim);}
.votos button.sel{background:var(--terra);border-color:var(--terra);color:#fff;}
.votos button.sel small{color:#fff;}
.votos button.sel.v0{background:#6b5d52;border-color:#6b5d52;}
.votos.vacia{opacity:.35;pointer-events:none;}

/* barra de acciones abajo */
.acciones{position:fixed;left:0;right:0;bottom:0;z-index:20;background:linear-gradient(to top,var(--bg) 75%,transparent);padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;justify-content:flex-end;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:14px 26px;border-radius:14px;background:var(--ink);color:#fff;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;font-size:14px;}
.btn.terra{background:var(--terra);}
.btn.ghost{background:var(--card);border:1.5px solid var(--line);color:var(--ink);}
.btn:disabled{opacity:.35;}

/* fórmulas: una tarjeta por persona */
.cuatro{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;}
@media (max-width:900px){.cuatro{grid-template-columns:repeat(2,minmax(0,1fr));}}
.ficha{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0;}
.ficha .letra{font-size:11px;letter-spacing:2px;font-weight:700;color:var(--terra);}
.ficha .quien{font-family:"Cormorant Garamond",Georgia,serif;font-size:34px;font-weight:700;line-height:1;}
.ficha .pn{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:6px 8px;font-size:14px;background:#fff;}
.ficha .vacia{color:var(--dim);font-size:14px;padding:20px 0;text-align:center;}
.paso-h{font-size:10.5px;letter-spacing:2.5px;text-transform:uppercase;font-weight:700;color:var(--dim);margin-top:4px;}
.item{display:flex;align-items:center;gap:8px;border-left:5px solid var(--c);background:#fff;border-radius:10px;padding:6px 8px;}
.item img{width:44px;height:44px;object-fit:contain;flex:0 0 auto;}
.item .n{flex:1;min-width:0;font-family:"Cormorant Garamond",Georgia,serif;font-size:19px;font-weight:600;line-height:1.05;}
.item .n small{display:block;font-family:Inter,sans-serif;font-size:11px;font-weight:400;color:var(--dim);}
.item .ml{font-size:24px;font-weight:700;white-space:nowrap;}
.item.base img{width:58px;height:58px;}
.item.base .ml{font-size:30px;}
.marca{font-size:12px;color:var(--dim);padding:0 4px;}

/* imágenes */
.ficha canvas{width:100%;height:auto;border-radius:10px;box-shadow:0 4px 16px rgba(46,36,32,.15);background:#fff;}
.tel{display:flex;align-items:stretch;border:1.5px solid var(--line);border-radius:10px;background:#fff;overflow:hidden;}
.tel span{display:flex;align-items:center;padding:0 2px 0 10px;color:var(--dim);font-size:16px;white-space:nowrap;}
.tel input{border:0;padding:10px 8px;font-size:17px;min-width:0;width:100%;background:transparent;}
.ficha label{font-size:12px;font-weight:600;}
.aviso-tab{background:var(--card);border:1.5px dashed var(--gold);border-radius:14px;padding:12px 14px;font-size:14px;margin-bottom:12px;}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:40;padding:16px;}
.modal .in{background:#fff;border-radius:20px;padding:22px;width:min(100%,480px);max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:10px;}
.modal input{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:10px;font-size:16px;}
.modal .chips{display:flex;gap:8px;flex-wrap:wrap;}
.modal .chips button{padding:10px 18px;border-radius:999px;border:1.5px solid var(--line);font-weight:700;}
.modal .chips button.on{background:var(--ink);color:#fff;border-color:var(--ink);}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;font-size:15px;z-index:50;max-width:calc(100% - 32px);text-align:center;}
.hint{color:var(--dim);font-size:13px;}
</style>
</head>
<body>
<header class="top"><div class="top-in" id="top"></div></header>
<main id="app"></main>
<div class="acciones" id="acc"></div>
<script>
/* Fotos de bases, notas y moléculas (webp embebidas) */
const IMGS = __IMGS__;
const FRA = [];   /* la tablet no pregunta perfumes favoritos */
</script>
<script>
__COMUN1__
__COMUN2__
/* ======================= TABLET =======================
   Una tablet atiende grupos de 4 invitados (A, B, C, D).
   1) Cata: el asistente anota el nombre y los votos de cada uno en una sola pantalla.
   2) Fórmulas: la receta de los 4, lado a lado.
   3) Imágenes: la imagen final de cada uno y su WhatsApp (opcional).
   Todo queda guardado en la tablet. Sin internet, las filas de la planilla y las imágenes quedan en cola
   y se suben solas cuando hay Wi-Fi (las imágenes, a la carpeta "VJ Cafayate" de Google Drive). */
const TAB = {
  DRIVE_URL: '',                 /* link del script de imágenes (Apps Script). Se puede cargar desde el panel ⚙ */
  CARPETA: 'VJ Cafayate',
  PREFIJO_ARCHIVO: 'VJ',
  LETRAS: ['A','B','C','D']
};
const KT = 'er_tab_' + nz(EVENTO.nombre).replace(/ /g,'_');
const tabletN = () => LS.get(KT+'_n', 1);
const driveUrl = () => LS.get(KT+'_drive', '') || TAB.DRIVE_URL;
const urlScript = () => LS.get('er_pb_url','') || EVENTO.SCRIPT_URL;
const vacioP = () => ({nom:'', v:{}, perf:[], wa:'', pn:'', r:null});
const nuevoGrupo = () => ({paso:'cata', ps:[vacioP(), vacioP(), vacioP(), vacioP()], t0:Date.now()});
let G = LS.get(KT+'_grupo', null) || nuevoGrupo();
const guardar = () => LS.set(KT+'_grupo', G);
const activos = () => G.ps.map((p,i)=>[p,i]).filter(([p])=>p.nom.trim());
let P = {paso:''};   /* para el código compartido de la imagen */

/* número de cliente corrido por tablet: T1-0001, T1-0002… */
function proximoCodigo(){ const k = KT+'_cont_'+tabletN(), n = LS.get(k, 0) + 1; LS.set(k, n); return `T${tabletN()}-${String(n).padStart(4,'0')}`; }

/* ---------- pantallas ---------- */
const VOT = [[3,'♥','encanta'],[2,'✦','gusta'],[1,'◦','poquito'],[0,'✕','nada']];
function barraTop(){
  const pend = LS.get('er_pb_cola',[]).length;
  $('#top').innerHTML = `<span class="wm">Emotional Reminder · Perfume Bar</span>
    <div class="pasos">${[['cata','1 · Cata'],['formulas','2 · Fórmulas'],['imagenes','3 · Imágenes']].map(([k,t])=>`<span class="${G.paso===k?'on':''}">${t}</span>`).join('')}</div>
    <span class="pend" id="pend">${pendTxt}</span>
    <button class="tab" onclick="abrirPanel()" aria-label="Panel">Tablet ${tabletN()} ⚙</button>`;
}
let pendTxt = '';
function vCata(){
  const fila = a => `<div class="aroma"><img src="${foto(a.img||a.id)}" alt=""><b>${esc((etapa(a.id)==='base'?'Base ':'')+a.n)}</b></div>` +
    G.ps.map((p,i)=>`<div class="${i%2?'':'col-'+(i?'c':'a')}"><div class="votos ${p.nom.trim()?'':'vacia'}" role="group" aria-label="${esc(a.n)} para ${esc(p.nom||TAB.LETRAS[i])}">
      ${VOT.map(([v,s,t])=>`<button class="${p.v[a.id]===v?'sel v'+v:''}" aria-pressed="${p.v[a.id]===v}" onclick="votarT(${i},'${a.id}',${v})">${s}<small>${t}</small></button>`).join('')}</div></div>`).join('');
  const grupoH = t => `<div class="grupo-h">${t}</div>`;
  const hechos = p => BASES.concat(CORAZON,SALIDA).filter(a=>p.v[a.id]!=null).length;
  return `<div class="cab"><div><h1>Cata · grupo de 4</h1><p class="sub">Escribí los nombres y marcá cómo le cae cada aroma a cada uno. Sin marcar cuenta como "un poquito".</p></div></div>
    <div class="grilla">
      <div class="hd"><span class="sub">Aroma</span></div>
      ${G.ps.map((p,i)=>`<div class="hd"><div class="persona"><span class="letra">${TAB.LETRAS[i]}</span>
        <input id="nom${i}" value="${esc(p.nom)}" placeholder="Nombre" autocomplete="off" oninput="nombreT(${i},this.value)"><small id="cnt${i}">${p.nom.trim()?hechos(p)+' de 12 marcados':'vacío'}</small></div></div>`).join('')}
      ${grupoH('Bases')}${BASES.map(fila).join('')}
      ${grupoH('Notas de corazón')}${CORAZON.map(fila).join('')}
      ${grupoH('Notas de salida')}${SALIDA.map(fila).join('')}
    </div>`;
}
function nombreT(i, val){ const antes = !!G.ps[i].nom.trim(); G.ps[i].nom = val; guardar();
  if(antes !== !!val.trim()){ const y = window.scrollY; pintar(); window.scrollTo(0,y); const inp = $('#nom'+i); if(inp){ inp.focus(); inp.setSelectionRange(val.length,val.length); } }
  else accionesCata(); }
function votarT(i, id, v){ const p = G.ps[i]; if(p.v[id]===v) delete p.v[id]; else p.v[id] = v; guardar(); const y = window.scrollY; pintar(); window.scrollTo(0,y); }
function accionesCata(){
  const n = activos().length;
  $('#acc').innerHTML = `<button class="btn ghost" onclick="limpiar()">Empezar grupo nuevo</button>
    <button class="btn terra" ${n?'':'disabled'} onclick="calcular()">Calcular fórmulas${n?` (${n})`:''} →</button>`;
}
function calcular(){
  activos().forEach(([p])=>{
    const nuevaBase = baseSugerida(p);
    const igual = p.r && p.r.base===nuevaBase && JSON.stringify(p.r._v)===JSON.stringify(p.v);
    if(!igual){ p.r = armar(p, nuevaBase); p.r._v = JSON.parse(JSON.stringify(p.v)); }
    if(!p.pn.trim() || p._pnAuto){ p.pn = nombreSugerido(p.r, p.nom.trim()); p._pnAuto = true; }
    if(!p.cod) p.cod = proximoCodigo();
  });
  G.paso = 'formulas'; guardar(); pintar(); window.scrollTo(0,0);
}
function vFormulas(){
  const ficha = (p,i) => { if(!p.nom.trim() || !p.r) return `<div class="ficha"><span class="letra">${TAB.LETRAS[i]}</span><div class="vacia">Sin invitado</div></div>`;
    const r = p.r, B = X[r.base], marca = r.baseMl + Object.values(r.magia).reduce((a,b)=>a+b,0);
    const item = (img, nom, sub, ml, col, cls) => `<div class="item ${cls||''}" style="--c:${col}"><img src="${foto(img)}" alt=""><div class="n">${esc(nom)}${sub?`<small>${esc(sub)}</small>`:''}</div><div class="ml">${ml}</div></div>`;
    const notas = g => Object.entries(r.notas).filter(([id])=>grupo(id)===g).sort((a,b)=>b[1]-a[1])
      .map(([id,ml])=>item(id, X[id].n, ml===1?'1 jeringa':ml+' jeringas', ml+' ml', g==='cor'?'var(--l-cor)':'var(--l-sal)')).join('');
    return `<div class="ficha"><span class="letra">${TAB.LETRAS[i]} · ${esc(p.cod||'')}</span><div class="quien">${esc(p.nom.trim())}</div>
      <input class="pn" value="${esc(p.pn)}" aria-label="Nombre del perfume de ${esc(p.nom)}" oninput="G.ps[${i}].pn=this.value;G.ps[${i}]._pnAuto=false;guardar()">
      <div class="paso-h">1 · Base · ampolla</div>${item(B.img, 'Base '+B.n, '', r.baseMl+' ml', 'var(--l-base)', 'base')}
      <div class="paso-h">2 · Moduladores · jeringa</div>${Object.entries(r.magia).sort((a,b)=>b[1]-a[1]).map(([id,ml])=>item(X[id].img, X[id].n, '', fmt(ml)+' ml', 'var(--l-mag)')).join('')}
      <div class="marca">Llega a la rayita de ${fmt(marca)} ml</div>
      <div class="paso-h">3 · Corazón · jeringa</div>${notas('cor')}
      <div class="paso-h">4 · Salida · jeringa</div>${notas('sal')}
    </div>`; };
  return `<div class="cab"><div><h1>Fórmulas</h1><p class="sub">Base 13 ml + moduladores 2 ml + notas 10 ml = 25 ml. El nombre del perfume se puede cambiar.</p></div></div>
    <div class="cuatro">${G.ps.map(ficha).join('')}</div>`;
}
function accionesFormulas(){
  $('#acc').innerHTML = `<button class="btn ghost" onclick="G.paso='cata';guardar();pintar();window.scrollTo(0,0)">← Volver a la cata</button>
    <button class="btn terra" onclick="G.paso='imagenes';guardar();pintar();window.scrollTo(0,0)">Ver las imágenes →</button>`;
}
function vImagenes(){
  const ficha = (p,i) => { if(!p.nom.trim() || !p.r) return `<div class="ficha"><span class="letra">${TAB.LETRAS[i]}</span><div class="vacia">Sin invitado</div></div>`;
    return `<div class="ficha"><span class="letra">${TAB.LETRAS[i]} · ${esc(p.cod||'')}</span><div class="quien" style="font-size:26px">${esc(p.nom.trim())}</div>
      <canvas id="cv${i}" width="1080" height="1528" aria-label="Imagen del perfume de ${esc(p.nom)}"></canvas>
      <label for="wa${i}">¿Te mandamos la foto por WhatsApp? <span class="hint">(opcional)</span></label>
      <div class="tel"><span>+${esc(EVENTO.WA_PREFIJO)}</span><input id="wa${i}" type="tel" inputmode="numeric" placeholder="11 5555 5555" value="${esc(waLocal(p.wa))}" oninput="G.ps[${i}].wa=this.value;guardar()"></div>
    </div>`; };
  return `<div class="aviso-tab">La imagen de cada perfume se guarda en esta tablet y les llega por WhatsApp después de la fiesta. Si quieren tenerla ya, pueden escanear el QR y hacer su perfume desde el celular.</div>
    <div class="cuatro">${G.ps.map(ficha).join('')}</div>`;
}
function accionesImagenes(){
  $('#acc').innerHTML = `<button class="btn ghost" onclick="G.paso='formulas';guardar();pintar();window.scrollTo(0,0)">← Fórmulas</button>
    <button class="btn terra" onclick="terminarGrupo()">Guardar y empezar otro grupo</button>`;
}
function dibujarTodas(){ if(G.paso!=='imagenes') return; G.ps.forEach((p,i)=>{ const cv = $('#cv'+i); if(cv && p.r) dibujar(p, cv.getContext('2d')); }); }
const alCargarImagen = () => dibujarTodas();

/* ---------- guardar: fila para la planilla + imagen en cola para Drive ---------- */
function fechaArchivo(){ const d = new Date(); return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0'); }
function nombreArchivo(p){
  const wa = waCompleto(p.wa), limpio = t => nz(t).replace(/ /g,'_').slice(0,30);
  return [TAB.PREFIJO_ARCHIVO, fechaArchivo(), wa ? '00'+wa : 'sinWA', p.cod, limpio(p.nom)].join('_') + '.jpg';
}
function filaTablet(p, archivo){
  const lbl = v => v==null ? '' : VOTOS.find(x=>x[0]===v)[2];
  const cols = [['ID',p.cod],['Fecha',new Date().toLocaleString('es-AR')],['Última actualización',new Date().toLocaleString('es-AR')],['Estado','Terminó'],
    ['Origen','Tablet '+tabletN()],['Nombre',p.nom.trim()],['WhatsApp',waCompleto(p.wa)?'+'+EVENTO.WA_PREFIJO+' '+waLocal(p.wa):''],['Código',p.cod]];
  BASES.concat(CORAZON, SALIDA).forEach(a=>cols.push([(etapa(a.id)==='base'?'Base ':'')+a.n, lbl(p.v[a.id])]));
  cols.push(['Base sugerida',X[p.r.base].n],['Base',X[p.r.base].n],
    ['Corazón',Object.keys(p.r.notas).filter(id=>grupo(id)==='cor').map(id=>X[id].n).join(' · ')],
    ['Salida',Object.keys(p.r.notas).filter(id=>grupo(id)==='sal').map(id=>X[id].n).join(' · ')],
    ['Receta (ml)',`${X[p.r.base].n} ${p.r.baseMl} ml · `+Object.entries(p.r.magia).map(([id,ml])=>`${X[id].n} ${fmt(ml)} ml`).join(' · ')+' · '+Object.entries(p.r.notas).map(([id,ml])=>`${X[id].n} ${ml} ml`).join(' · ')],
    ['Perfil',p.r.perfil],['Nombre del perfume',p.pn.trim()],['Archivo imagen',archivo]);
  return {clave:EVENTO.CLAVE, hoja:EVENTO.HOJA, id:p.cod, columnas:cols, t:Date.now()};
}
async function terminarGrupo(){
  const lista = activos(); if(!lista.length) return;
  if(terminarGrupo.corriendo) return; terminarGrupo.corriendo = true;
  const bt = document.querySelector('#acc .btn.terra'); if(bt){ bt.disabled = true; bt.textContent = 'Guardando…'; }
  try{ await Promise.race([document.fonts.ready, new Promise(r=>setTimeout(r,1500))]); }catch(e){}
  try{
  for(const [p] of lista){
    const cv = document.createElement('canvas'); cv.width = 1080; cv.height = 1528; dibujar(p, cv.getContext('2d'));
    const blob = await new Promise(res=>cv.toBlob(res,'image/jpeg',.88));
    const archivo = nombreArchivo(p);
    await idbPut({nombre:archivo, blob, t:Date.now()});
    const cola = LS.get('er_pb_cola',[]).filter(r=>r.id!==p.cod); cola.push(filaTablet(p, archivo)); LS.set('er_pb_cola', cola);
    const hist = LS.get(KT+'_hist',[]); hist.push({cod:p.cod, nom:p.nom.trim(), pn:p.pn.trim(), archivo, t:Date.now()}); LS.set(KT+'_hist', hist);
  }
  aviso(`Guardados ${lista.length} perfume${lista.length>1?'s':''}`);
  G = nuevoGrupo(); guardar(); pintar(); window.scrollTo(0,0); subir();
  } catch(e){ aviso('No se pudo guardar: ' + e.message); pintar(); }
  finally { terminarGrupo.corriendo = false; }
}
function limpiar(){ if(activos().length && !confirm('¿Borrar este grupo y empezar otro? Lo que no guardaste se pierde.')) return; G = nuevoGrupo(); guardar(); pintar(); window.scrollTo(0,0); }

/* ---------- cola de imágenes (IndexedDB) ---------- */
function idb(){ return new Promise((res,rej)=>{ const r = indexedDB.open('er_tablet_fotos', 1); r.onupgradeneeded = ()=>r.result.createObjectStore('fotos', {keyPath:'nombre'}); r.onsuccess = ()=>res(r.result); r.onerror = ()=>rej(r.error); }); }
async function idbPut(o){ const db = await idb(); return new Promise((res,rej)=>{ const tx = db.transaction('fotos','readwrite'); tx.objectStore('fotos').put(o); tx.oncomplete = res; tx.onerror = ()=>rej(tx.error); }); }
async function idbTodas(){ const db = await idb(); return new Promise((res,rej)=>{ const q = db.transaction('fotos').objectStore('fotos').getAll(); q.onsuccess = ()=>res(q.result); q.onerror = ()=>rej(q.error); }); }
async function idbBorrar(n){ const db = await idb(); return new Promise(res=>{ const tx = db.transaction('fotos','readwrite'); tx.objectStore('fotos').delete(n); tx.oncomplete = res; }); }
const aBase64 = b => new Promise(res=>{ const f = new FileReader(); f.onload = ()=>res(String(f.result).split(',')[1]); f.readAsDataURL(b); });

let subiendo = false;
async function subir(){
  if(subiendo) return; subiendo = true;
  try{
    if(navigator.onLine){
      /* filas de la planilla */
      for(const r of LS.get('er_pb_cola',[])){
        try{ const resp = await fetch(urlScript(),{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(r)}); const j = await resp.json();
          if(j.ok) LS.set('er_pb_cola', LS.get('er_pb_cola',[]).filter(x=>!(x.id===r.id && x.t===r.t))); }catch(e){}
      }
      /* imágenes a Drive */
      if(driveUrl()){
        for(const f of await idbTodas()){
          try{ const resp = await fetch(driveUrl(),{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
                 body:JSON.stringify({clave:EVENTO.CLAVE, carpeta:TAB.CARPETA, nombre:f.nombre, mime:'image/jpeg', data:await aBase64(f.blob)})});
               const j = await resp.json(); if(j.ok) await idbBorrar(f.nombre); }catch(e){}
        }
      }
    }
  } finally { subiendo = false; actualizarPend(); }
}
async function actualizarPend(){
  let nf = 0; try{ nf = (await idbTodas()).length; }catch(e){}
  const nr = LS.get('er_pb_cola',[]).length;
  pendTxt = (nf || nr) ? `Por subir: ${nf} imágenes · ${nr} filas` : 'Todo subido ✓';
  const el = $('#pend'); if(el) el.textContent = pendTxt;
}
setInterval(subir, 30000);
window.addEventListener('online', subir);

/* ---------- panel ---------- */
let panelOk = false;
function abrirPanel(){
  const d = document.createElement('div'); d.className = 'modal'; d.onclick = e=>{ if(e.target===d) d.remove(); };
  const hist = LS.get(KT+'_hist',[]);
  d.innerHTML = panelOk ? `<div class="in"><h1 style="font-size:26px">Panel de la tablet</h1>
      <label>¿Qué tablet es esta?</label>
      <div class="chips">${[1,2,3,4].map(n=>`<button class="${tabletN()===n?'on':''}" onclick="LS.set(KT+'_n',${n});this.closest('.modal').remove();pintar();abrirPanel()">Tablet ${n}</button>`).join('')}</div>
      <p class="hint">Perfumes hechos en esta tablet: <b>${hist.length}</b> · ${esc(pendTxt)}</p>
      <label for="pdrive">Link del script de imágenes (Drive)</label><input id="pdrive" value="${esc(driveUrl())}" placeholder="https://script.google.com/macros/s/…/exec">
      <label for="purl">Link del script de la planilla</label><input id="purl" value="${esc(urlScript())}">
      <button class="btn" onclick="LS.set(KT+'_drive',$('#pdrive').value.trim());LS.set('er_pb_url',$('#purl').value.trim());this.closest('.modal').remove();subir();aviso('Guardado')">Guardar y subir ahora</button>
      <button class="btn ghost" onclick="this.closest('.modal').remove()">Cerrar</button></div>`
    : `<div class="in"><h1 style="font-size:26px">Panel</h1><label for="ppin">PIN</label><input id="ppin" type="password" inputmode="numeric">
      <button class="btn" onclick="if($('#ppin').value===EVENTO.PIN){panelOk=true;this.closest('.modal').remove();abrirPanel()}else{aviso('PIN incorrecto')}">Entrar</button>
      <button class="btn ghost" onclick="this.closest('.modal').remove()">Cancelar</button></div>`;
  document.body.appendChild(d); const i = d.querySelector('input'); if(i && !panelOk) i.focus();
}

/* ---------- pintar ---------- */
function pintar(){
  if(G.paso!=='cata' && !activos().some(([p])=>p.r)) G.paso = 'cata';
  P.paso = G.paso==='imagenes' ? 'final' : '';
  barraTop();
  $('#app').innerHTML = {cata:vCata, formulas:vFormulas, imagenes:vImagenes}[G.paso]();
  ({cata:accionesCata, formulas:accionesFormulas, imagenes:accionesImagenes})[G.paso]();
  if(G.paso==='imagenes') dibujarTodas();
}
if(document.fonts){ Promise.all(['600 96px "Cormorant Garamond"','italic 500 42px "Cormorant Garamond"','600 24px Inter','400 24px Inter'].map(f=>document.fonts.load(f).catch(()=>{}))).then(dibujarTodas); }
/* funciona sin internet: se guarda en la tablet la primera vez que se abre con Wi-Fi */
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
pintar(); actualizarPend(); subir();
</script>
